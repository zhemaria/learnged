<svg
            width="700"
            height="220"
            viewBox="0 0 700 220"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Esquema del recorrido de los gases entre los pulmones y las células. El oxígeno viaja desde los pulmones a la sangre y de la sangre a las células, donde la mitocondria lo utiliza. El dióxido de carbono producido por las células hace el recorrido inverso: de las células a la sangre y de la sangre a los pulmones, desde donde se expulsa al exterior.">
            <rect x="250" y="30" width="200" height="28" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="2"></rect>
            <text x="350" y="49" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">El oxígeno avanza hacia las células</text>

            <rect x="60" y="80" width="150" height="66" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="135" y="108" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Pulmones</text>
            <text x="135" y="128" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">alvéolos</text>

            <rect x="275" y="80" width="150" height="66" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="350" y="108" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Sangre</text>
            <text x="350" y="128" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">glóbulos rojos</text>

            <rect x="490" y="80" width="150" height="66" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="565" y="108" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Células</text>
            <text x="565" y="128" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">mitocondria</text>

            <g stroke="#1b5e20" stroke-width="3">
              <line x1="212" y1="100" x2="263" y2="100"></line>
              <line x1="427" y1="100" x2="478" y2="100"></line>
            </g>
            <g fill="#1b5e20">
              <polygon points="273,100 260,93 260,107"></polygon>
              <polygon points="488,100 475,93 475,107"></polygon>
            </g>

            <g stroke="#9e1c66" stroke-width="3">
              <line x1="488" y1="128" x2="437" y2="128"></line>
              <line x1="273" y1="128" x2="222" y2="128"></line>
            </g>
            <g fill="#9e1c66">
              <polygon points="427,128 440,121 440,135"></polygon>
              <polygon points="212,128 225,121 225,135"></polygon>
            </g>

            <rect x="250" y="170" width="200" height="28" rx="8" fill="#fce1f0" stroke="#9e1c66" stroke-width="2"></rect>
            <text x="350" y="189" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#800d4e" text-anchor="middle">El dióxido de carbono regresa</text>
          </svg>