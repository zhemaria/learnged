<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama rotulado de una onda. La línea horizontal central es la posición de reposo. Los puntos más altos de la curva se llaman crestas y los más bajos, valles. La longitud de onda es la distancia entre dos crestas consecutivas, o entre dos valles consecutivos, y se representa con la letra griega lambda. La amplitud es la distancia vertical desde la posición de reposo hasta una cresta, e indica la energía que transporta la onda. La frecuencia es el número de ondas completas que pasan por un punto en un segundo y se mide en hercios.">
        <line x1="40" y1="150" x2="660" y2="150" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/>
        <text x="668" y="146" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="end">reposo</text>
        <path d="M 60 150 Q 105 50 150 150 Q 195 250 240 150 Q 285 50 330 150 Q 375 250 420 150 Q 465 50 510 150 Q 555 250 600 150" fill="none" stroke="#1e3a8a" stroke-width="4"/>

        <circle cx="105" cy="100" r="6" fill="#14265e"/>
        <text x="105" y="86" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Cresta</text>
        <circle cx="195" cy="200" r="6" fill="#14265e"/>
        <text x="195" y="226" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Valle</text>

        <line x1="105" y1="60" x2="285" y2="60" stroke="#14265e" stroke-width="2"/>
        <polygon points="111,54 97,60 111,66" fill="#14265e"/>
        <polygon points="279,54 293,60 279,66" fill="#14265e"/>
        <text x="195" y="46" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">Longitud de onda (λ)</text>

        <line x1="465" y1="106" x2="465" y2="144" stroke="#14265e" stroke-width="2"/>
        <polygon points="459,114 465,100 471,114" fill="#14265e"/>
        <polygon points="459,136 465,150 471,136" fill="#14265e"/>
        <text x="485" y="74" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="start">Amplitud</text>
        <text x="485" y="90" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="start">(energía que transporta)</text>

        <text x="350" y="278" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Frecuencia: cuántas ondas completas pasan por un punto en un segundo · se mide en hercios (Hz)</text>
      </svg>