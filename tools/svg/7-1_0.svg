<svg
            width="720"
            height="330"
            viewBox="0 0 720 330"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Corte del interior de la Tierra con sus capas y las corrientes de convección del manto. Desde el exterior hacia el centro se distinguen: la corteza, una capa delgada y sólida sobre la que vivimos; el manto, la capa más gruesa, de roca caliente que fluye muy lentamente; el núcleo externo, líquido y metálico; y el núcleo interno, sólido pese a su altísima temperatura, por la enorme presión que soporta. En el manto se representan corrientes circulares de convección: el material caliente asciende, se enfría al acercarse a la corteza, se desplaza lateralmente y vuelve a descender. Esas corrientes son el motor que arrastra las placas de la corteza.">
            <circle cx="200" cy="165" r="142" fill="#a78bdb" stroke="#3c1478" stroke-width="3" />
            <circle cx="200" cy="165" r="134" fill="#e6dcf9" stroke="#3c1478" stroke-width="1.5" />
            <circle cx="200" cy="165" r="92" fill="#d3c3f2" stroke="#3c1478" stroke-width="3" />
            <circle cx="200" cy="165" r="46" fill="#7c3aed" stroke="#3c1478" stroke-width="3" />
            <text x="200" y="170" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Núcleo interno</text>
            <text x="200" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Núcleo externo</text>
            <text x="200" y="56" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Manto</text>

            <path d="M 98 232 Q 72 165 98 100" fill="none" stroke="#3c1478" stroke-width="3" />
            <polygon points="91,108 99,91 106,107" fill="#3c1478" />
            <path d="M 302 100 Q 328 165 302 232" fill="none" stroke="#3c1478" stroke-width="3" />
            <polygon points="294,223 301,239 309,222" fill="#3c1478" />

            <rect x="356" y="48" width="14" height="14" fill="#a78bdb" stroke="#3c1478" stroke-width="1.5" />
            <text x="380" y="60" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Corteza</text>
            <text x="380" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Delgada y sólida. Es la que se rompe en placas.</text>

            <rect x="356" y="106" width="14" height="14" fill="#e6dcf9" stroke="#3c1478" stroke-width="1.5" />
            <text x="380" y="118" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Manto</text>
            <text x="380" y="138" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">La capa más gruesa. Roca caliente que fluye</text>
            <text x="380" y="156" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">muy despacio: centímetros por año.</text>

            <rect x="356" y="182" width="14" height="14" fill="#d3c3f2" stroke="#3c1478" stroke-width="1.5" />
            <text x="380" y="194" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Núcleo externo</text>
            <text x="380" y="214" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Metálico y líquido.</text>

            <rect x="356" y="240" width="14" height="14" fill="#7c3aed" stroke="#3c1478" stroke-width="1.5" />
            <text x="380" y="252" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Núcleo interno</text>
            <text x="380" y="272" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Sólido pese al calor: la presión es tan alta</text>
            <text x="380" y="290" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">que impide que fluya.</text>

            <text x="200" y="322" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Las flechas son corrientes de convección en el manto</text>
          </svg>