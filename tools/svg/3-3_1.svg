<svg
            width="700"
            height="300"
            viewBox="0 0 700 300"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Lazo de retroalimentación negativa en cinco etapas dispuestas en círculo. Primera etapa: se detecta un cambio respecto del valor de referencia. Segunda: un receptor recoge la señal. Tercera: el centro de control la interpreta y decide. Cuarta: un efector ejecuta la orden. Quinta: se produce una respuesta que va en dirección contraria al cambio y devuelve el valor a la referencia. La quinta etapa conecta de nuevo con la primera, cerrando el ciclo.">
            <g stroke="#1b5e20" stroke-width="3" fill="none">
              <line x1="432" y1="52" x2="516" y2="112"></line>
              <line x1="594" y1="162" x2="520" y2="228"></line>
              <line x1="398" y1="255" x2="300" y2="255"></line>
              <line x1="150" y1="228" x2="112" y2="176"></line>
              <line x1="120" y1="108" x2="272" y2="52"></line>
            </g>
            <g fill="#1b5e20">
              <polygon points="520,115 505,110 512,123"></polygon>
              <polygon points="516,231 531,226 524,239"></polygon>
              <polygon points="290,255 305,248 305,262"></polygon>
              <polygon points="109,172 124,175 115,186"></polygon>
              <polygon points="276,51 261,48 267,61"></polygon>
            </g>

            <circle cx="350" cy="150" r="52" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"></circle>
            <text x="350" y="145" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">Valor de</text>
            <text x="350" y="163" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">referencia</text>

            <rect x="276" y="18" width="156" height="46" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="354" y="38" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">1 · Cambio</text>
            <text x="354" y="55" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">el valor se aparta</text>

            <rect x="520" y="106" width="150" height="46" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="595" y="126" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">2 · Receptor</text>
            <text x="595" y="143" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">detecta la señal</text>

            <rect x="400" y="232" width="180" height="46" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="490" y="252" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">3 · Centro de control</text>
            <text x="490" y="269" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">interpreta y ordena</text>

            <rect x="130" y="232" width="160" height="46" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="210" y="252" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">4 · Efector</text>
            <text x="210" y="269" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">ejecuta la orden</text>

            <rect x="18" y="106" width="176" height="60" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"></rect>
            <text x="106" y="128" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">5 · Respuesta</text>
            <text x="106" y="145" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">en dirección contraria</text>
            <text x="106" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">al cambio detectado</text>
          </svg>