<svg width="700" height="270" viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación de los tres estados de la materia según la disposición de las partículas. En el sólido, las partículas aparecen ordenadas en filas y columnas muy juntas, y solo vibran en su sitio: el sólido tiene forma y volumen propios. En el líquido, las partículas siguen juntas pero desordenadas y pueden deslizarse unas sobre otras: el líquido tiene volumen propio pero adopta la forma del recipiente. En el gas, las partículas están muy separadas y dispersas por todo el espacio disponible: el gas no tiene forma ni volumen propios. La energía de las partículas aumenta del sólido al gas.">
        <rect x="20" y="30" width="200" height="150" rx="10" fill="#fff8f5" stroke="#8c2600" stroke-width="2"/>
        <text x="120" y="22" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Sólido</text>
        <circle cx="60" cy="70" r="11" fill="#bf360c"/><circle cx="100" cy="70" r="11" fill="#bf360c"/><circle cx="140" cy="70" r="11" fill="#bf360c"/><circle cx="180" cy="70" r="11" fill="#bf360c"/>
        <circle cx="60" cy="105" r="11" fill="#bf360c"/><circle cx="100" cy="105" r="11" fill="#bf360c"/><circle cx="140" cy="105" r="11" fill="#bf360c"/><circle cx="180" cy="105" r="11" fill="#bf360c"/>
        <circle cx="60" cy="140" r="11" fill="#bf360c"/><circle cx="100" cy="140" r="11" fill="#bf360c"/><circle cx="140" cy="140" r="11" fill="#bf360c"/><circle cx="180" cy="140" r="11" fill="#bf360c"/>
        <text x="120" y="200" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Ordenadas y muy juntas.</text>
        <text x="120" y="218" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Solo vibran en su sitio.</text>
        <text x="120" y="240" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Forma y volumen propios</text>

        <rect x="250" y="30" width="200" height="150" rx="10" fill="#fff8f5" stroke="#8c2600" stroke-width="2"/>
        <text x="350" y="22" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Líquido</text>
        <circle cx="290" cy="78" r="11" fill="#bf360c"/><circle cx="326" cy="66" r="11" fill="#bf360c"/><circle cx="364" cy="82" r="11" fill="#bf360c"/><circle cx="404" cy="70" r="11" fill="#bf360c"/>
        <circle cx="278" cy="112" r="11" fill="#bf360c"/><circle cx="316" cy="124" r="11" fill="#bf360c"/><circle cx="356" cy="112" r="11" fill="#bf360c"/><circle cx="398" cy="120" r="11" fill="#bf360c"/>
        <circle cx="300" cy="150" r="11" fill="#bf360c"/><circle cx="342" cy="156" r="11" fill="#bf360c"/><circle cx="384" cy="150" r="11" fill="#bf360c"/><circle cx="420" cy="140" r="11" fill="#bf360c"/>
        <text x="350" y="200" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Juntas pero desordenadas.</text>
        <text x="350" y="218" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Se deslizan unas sobre otras.</text>
        <text x="350" y="240" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Volumen propio, forma del envase</text>

        <rect x="480" y="30" width="200" height="150" rx="10" fill="#fff8f5" stroke="#8c2600" stroke-width="2"/>
        <text x="580" y="22" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Gas</text>
        <circle cx="512" cy="56" r="11" fill="#bf360c"/><circle cx="600" cy="48" r="11" fill="#bf360c"/><circle cx="654" cy="82" r="11" fill="#bf360c"/>
        <circle cx="530" cy="118" r="11" fill="#bf360c"/><circle cx="612" cy="106" r="11" fill="#bf360c"/>
        <circle cx="498" cy="162" r="11" fill="#bf360c"/><circle cx="576" cy="164" r="11" fill="#bf360c"/><circle cx="648" cy="146" r="11" fill="#bf360c"/>
        <text x="580" y="200" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Muy separadas y muy rápidas.</text>
        <text x="580" y="218" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Ocupan todo el espacio.</text>
        <text x="580" y="240" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Ni forma ni volumen propios</text>

        <text x="350" y="264" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#8c2600" text-anchor="middle">La energía de las partículas aumenta de izquierda a derecha</text>
      </svg>