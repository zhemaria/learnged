<svg width="700" height="255" viewBox="0 0 700 255" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los tres elementos del mecanismo de la selección natural dispuestos en secuencia. Primero, la variación: los individuos de una población no son idénticos entre sí. Segundo, la presión ambiental: alguna condición del entorno hace que ciertas variantes sobrevivan mejor que otras. Tercero, el éxito reproductivo: los que sobreviven dejan más descendencia y su variante se hace más frecuente en la población. El resultado es que la población cambia con las generaciones, aunque ningún individuo haya cambiado.">
        <rect x="20" y="40" width="195" height="118" rx="10" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
        <text x="117" y="70" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e400f" text-anchor="middle">1 · Variación</text>
        <text x="117" y="98" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">Los individuos de una</text>
        <text x="117" y="116" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">población no son</text>
        <text x="117" y="134" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">idénticos entre sí</text>

        <rect x="252" y="40" width="195" height="118" rx="10" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
        <text x="349" y="70" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e400f" text-anchor="middle">2 · Presión ambiental</text>
        <text x="349" y="98" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">Alguna condición del</text>
        <text x="349" y="116" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">entorno favorece a</text>
        <text x="349" y="134" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">unas variantes y no a otras</text>

        <rect x="484" y="40" width="195" height="118" rx="10" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
        <text x="581" y="70" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e400f" text-anchor="middle">3 · Éxito reproductivo</text>
        <text x="581" y="98" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">Los favorecidos dejan</text>
        <text x="581" y="116" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">más descendencia y su</text>
        <text x="581" y="134" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">variante se hace frecuente</text>

        <g stroke="#1e400f" stroke-width="3">
          <line x1="217" y1="99" x2="240" y2="99"/>
          <line x1="449" y1="99" x2="472" y2="99"/>
        </g>
        <g fill="#1e400f">
          <polygon points="250,99 236,92 236,106"/>
          <polygon points="482,99 468,92 468,106"/>
        </g>

        <rect x="120" y="186" width="460" height="50" rx="10" fill="#bfd9a9" stroke="#1e400f" stroke-width="3"/>
        <text x="350" y="208" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Resultado: la población cambia con las generaciones</text>
        <text x="350" y="227" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">aunque ningún individuo haya cambiado</text>
      </svg>