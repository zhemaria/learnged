<svg
            width="700"
            height="320"
            viewBox="0 0 700 320"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Serie temporal esquemática que muestra una tendencia ascendente con variación interanual. El eje horizontal representa los años y el vertical el valor medido. La línea de datos sube en conjunto de izquierda a derecha, pero lo hace con altibajos: hay años concretos en que el valor baja respecto al anterior, y sin embargo cada uno de esos descensos queda por encima de los valores de las décadas anteriores. Una línea recta discontinua superpuesta representa la tendencia general ascendente. La lectura correcta es que la variación de un año no contradice la tendencia del conjunto.">
            <line x1="70" y1="250" x2="660" y2="250" stroke="#222" stroke-width="2" />
            <line x1="70" y1="250" x2="70" y2="40" stroke="#222" stroke-width="2" />
            <text x="365" y="284" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">Años (serie larga)</text>
            <text x="40" y="146" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">Valor</text>

            <polyline
              points="80,222 116,196 152,212 188,180 224,192 260,160 296,176 332,142 368,156 404,120 440,138 476,104 512,118 548,84 584,96 620,64"
              fill="none"
              stroke="#5b21b6"
              stroke-width="3" />
            <line x1="80" y1="216" x2="620" y2="76" stroke="#3c1478" stroke-width="3" stroke-dasharray="10 6" />
            <line x1="92" y1="58" x2="124" y2="58" stroke="#3c1478" stroke-width="3" stroke-dasharray="10 6" />
            <text x="132" y="62" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Línea de tendencia</text>
            <line x1="92" y1="80" x2="124" y2="80" stroke="#5b21b6" stroke-width="3" />
            <text x="132" y="84" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Dato de cada año</text>

            <circle cx="224" cy="192" r="7" fill="none" stroke="#b3261e" stroke-width="3" />
            <text x="224" y="228" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">bajó respecto</text>
            <text x="224" y="244" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">al año anterior</text>
            <circle cx="584" cy="96" r="7" fill="none" stroke="#b3261e" stroke-width="3" />
            <text x="584" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">por encima del inicio</text>
            <text x="584" y="36" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">también bajó, pero sigue muy</text>

            <text x="365" y="308" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">
              Un descenso puntual no contradice una tendencia ascendente
            </text>
          </svg>