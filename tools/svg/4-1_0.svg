<svg
            width="700"
            height="240"
            viewBox="0 0 700 240"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Esquema de las dos hebras del ADN emparejadas. La hebra uno tiene la secuencia adenina, timina, citosina, guanina, adenina, timina. La hebra dos tiene la secuencia complementaria: timina, adenina, guanina, citosina, timina, adenina. Cada base tiene su propio color: adenina en rojo, timina en amarillo, citosina en azul y guanina en violeta. Cada adenina se empareja siempre con una timina y cada citosina con una guanina.">
            <text x="20" y="46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f">Hebra 1</text>
            <text x="20" y="196" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f">Hebra 2</text>

            <line x1="95" y1="62" x2="660" y2="62" stroke="#1e400f" stroke-width="5" />
            <line x1="95" y1="178" x2="660" y2="178" stroke="#1e400f" stroke-width="5" />

            <g stroke="#33691e" stroke-width="2.5">
              <line x1="130" y1="88" x2="130" y2="152" />
              <line x1="220" y1="88" x2="220" y2="152" />
              <line x1="310" y1="88" x2="310" y2="152" />
