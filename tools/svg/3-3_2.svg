<svg
            width="700"
            height="265"
            viewBox="0 0 700 265"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Gráfica de barras ilustrativa de la tasa de visitas a urgencias por asma por cada diez mil habitantes en cuatro áreas comunitarias. El área A registra veintiocho, el área B cuarenta y uno, el área C ciento cuatro y el área D ciento diecinueve. Las dos últimas áreas presentan tasas mucho más altas que las dos primeras.">
            <text x="90" y="22" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f3d16">Visitas a urgencias por asma (por cada 10 000 habitantes)</text>
            <text x="90" y="40" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16">Datos ilustrativos · cuatro áreas comunitarias</text>

            <g stroke="#c3e2c5" stroke-width="1">
              <line x1="90" y1="60" x2="620" y2="60"></line>
              <line x1="90" y1="105" x2="620" y2="105"></line>
              <line x1="90" y1="150" x2="620" y2="150"></line>
              <line x1="90" y1="195" x2="620" y2="195"></line>
            </g>

            <line x1="90" y1="210" x2="620" y2="210" stroke="#0f3d16" stroke-width="2.5"></line>
            <line x1="90" y1="60" x2="90" y2="210" stroke="#0f3d16" stroke-width="2.5"></line>

            <g fill="#1b5e20">
              <rect x="140" y="182" width="70" height="28"></rect>
              <rect x="270" y="169" width="70" height="41"></rect>
              <rect x="400" y="106" width="70" height="104"></rect>
              <rect x="530" y="91" width="70" height="119"></rect>
            </g>

            <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">
              <text x="175" y="176">28</text>
              <text x="305" y="163">41</text>
              <text x="435" y="100">104</text>
              <text x="565" y="85">119</text>
            </g>

            <g font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="end">
              <text x="80" y="64">150</text>
              <text x="80" y="109">100</text>
              <text x="80" y="154">50</text>
              <text x="80" y="214">0</text>
            </g>

            <g font-family="Segoe UI, sans-serif" font-size="12" fill="#0f3d16" text-anchor="middle">
              <text x="175" y="230">Área A</text>
              <text x="305" y="230">Área B</text>
              <text x="435" y="230">Área C</text>
              <text x="565" y="230">Área D</text>
            </g>
            <text x="355" y="254" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">Área comunitaria</text>
          </svg>