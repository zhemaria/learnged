<svg
            width="700"
            height="205"
            viewBox="0 0 700 205"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Esquema de la expresión genética en dos pasos. Del ADN, situado en el núcleo, se obtiene el ARN mensajero mediante la transcripción. Del ARN mensajero, ya en el ribosoma, se obtiene la proteína mediante la traducción.">
            <rect x="177" y="38" width="116" height="28" rx="8" fill="#d3e6c2" stroke="#1e400f" stroke-width="2" />
            <text x="235" y="57" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">transcripción</text>

            <rect x="412" y="38" width="116" height="28" rx="8" fill="#d3e6c2" stroke="#1e400f" stroke-width="2" />
            <text x="470" y="57" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">traducción</text>

            <rect x="40" y="82" width="150" height="58" rx="8" fill="#bfd9a9" stroke="#1e400f" stroke-width="3" />
            <text x="115" y="118" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1e400f" text-anchor="middle">ADN</text>

            <rect x="275" y="82" width="150" height="58" rx="8" fill="#bfd9a9" stroke="#1e400f" stroke-width="3" />
            <text x="350" y="110" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e400f" text-anchor="middle">ARN</text>
            <text x="350" y="128" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">mensajero</text>

            <rect x="510" y="82" width="150" height="58" rx="8" fill="#bfd9a9" stroke="#1e400f" stroke-width="3" />
            <text x="585" y="118" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1e400f" text-anchor="middle">Proteína</text>

            <g stroke="#1e400f" stroke-width="3">
              <line x1="192" y1="111" x2="263" y2="111" />
              <line x1="427" y1="111" x2="498" y2="111" />
            </g>
            <g fill="#1e400f">
              <polygon points="273,111 259,104 259,118" />
              <polygon points="508,111 494,104 494,118" />
            </g>

            <g font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">
              <text x="115" y="164">en el núcleo</text>
              <text x="350" y="164">sale al citoplasma</text>
              <text x="585" y="164">en el ribosoma</text>
            </g>
            <text x="350" y="192" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">Tres letras del ARN mensajero, un aminoácido</text>
          </svg>