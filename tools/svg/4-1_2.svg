<svg
            width="700"
            height="225"
            viewBox="0 0 700 225"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Comparación entre una secuencia normal y la misma secuencia con una sustitución de una sola base. La secuencia normal tiene los codones A U G, C C U, G A G, U A G, que se traducen como metionina, prolina, ácido glutámico y alto. En la secuencia mutada, el tercer codón pasa de G A G a G U G, y el aminoácido correspondiente cambia de ácido glutámico a valina. Los demás aminoácidos no varían.">
            <text x="20" y="52" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f">Secuencia normal</text>
            <text x="20" y="152" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f">Con una sustitución</text>

            <g fill="#d3e6c2" stroke="#1e400f" stroke-width="2.5">
              <rect x="190" y="30" width="106" height="34" rx="7" />
              <rect x="306" y="30" width="106" height="34" rx="7" />
              <rect x="422" y="30" width="106" height="34" rx="7" />
              <rect x="538" y="30" width="106" height="34" rx="7" />
            </g>
            <g font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1e400f" text-anchor="middle">
              <text x="243" y="54">AUG</text>
              <text x="359" y="54">CCU</text>
              <text x="475" y="54">GAG</text>
              <text x="591" y="54">UAG</text>
            </g>
            <g font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">
              <text x="243" y="84">metionina</text>
              <text x="359" y="84">prolina</text>
              <text x="475" y="84">ácido glutámico</text>
              <text x="591" y="84">alto</text>
            </g>

            <g fill="#d3e6c2" stroke="#1e400f" stroke-width="2.5">
              <rect x="190" y="130" width="106" height="34" rx="7" />
              <rect x="306" y="130" width="106" height="34" rx="7" />
              <rect x="538" y="130" width="106" height="34" rx="7" />
            </g>
            <rect x="422" y="130" width="106" height="34" rx="7" fill="#fce1f0" stroke="#9e1c66" stroke-width="3" />
            <g font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1e400f" text-anchor="middle">
              <text x="243" y="154">AUG</text>
              <text x="359" y="154">CCU</text>
              <text x="591" y="154">UAG</text>
            </g>
            <text x="475" y="154" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#800d4e" text-anchor="middle">GUG</text>
            <g font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">
              <text x="243" y="184">metionina</text>
              <text x="359" y="184">prolina</text>
              <text x="591" y="184">alto</text>
            </g>
            <text x="475" y="184" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#800d4e" text-anchor="middle">valina</text>

            <text x="350" y="212" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">Una sola letra distinta, un aminoácido distinto</text>
          </svg>