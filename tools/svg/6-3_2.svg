<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema del espectro electromagnético ordenado de izquierda a derecha. En el extremo izquierdo están las ondas de radio, con longitudes de onda muy grandes, del orden de metros o kilómetros, baja frecuencia y baja energía. Siguen las microondas, el infrarrojo, la estrecha franja de la luz visible, el ultravioleta, los rayos X y, en el extremo derecho, los rayos gamma, con longitudes de onda diminutas, alta frecuencia y alta energía. La regla general es que a medida que la longitud de onda disminuye, la frecuencia y la energía aumentan.">
        <rect x="20" y="70" width="94" height="54" fill="#dbe2f7" stroke="#14265e" stroke-width="2"/>
        <rect x="114" y="70" width="94" height="54" fill="#cdd7f4" stroke="#14265e" stroke-width="2"/>
        <rect x="208" y="70" width="94" height="54" fill="#bfcbef" stroke="#14265e" stroke-width="2"/>
        <rect x="302" y="70" width="60" height="54" fill="#9fb0e6" stroke="#14265e" stroke-width="3"/>
        <rect x="362" y="70" width="94" height="54" fill="#8296dd" stroke="#14265e" stroke-width="2"/>
        <rect x="456" y="70" width="94" height="54" fill="#3a4a8f" stroke="#14265e" stroke-width="2"/>
        <rect x="550" y="70" width="110" height="54" fill="#25305f" stroke="#14265e" stroke-width="2"/>

        <text x="67" y="102" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Radio</text>
        <text x="161" y="102" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Microondas</text>
        <text x="255" y="102" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Infrarrojo</text>
        <text x="332" y="102" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#14265e" text-anchor="middle">Visible</text>
        <text x="409" y="102" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Ultravioleta</text>
        <text x="503" y="102" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Rayos X</text>
        <text x="605" y="102" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Rayos gamma</text>

        <text x="67" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10³ m</text>
        <text x="161" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10⁻² m</text>
        <text x="255" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10⁻⁵ m</text>
        <text x="332" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10⁻⁷ m</text>
        <text x="409" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10⁻⁸ m</text>
        <text x="503" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10⁻¹⁰ m</text>
        <text x="605" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">10⁻¹² m</text>
        <text x="350" y="46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Longitud de onda aproximada (orden de magnitud)</text>

        <line x1="20" y1="186" x2="646" y2="186" stroke="#14265e" stroke-width="2"/>
        <polygon points="646,179 662,186 646,193" fill="#14265e"/>
        <text x="330" y="178" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">La longitud de onda disminuye →</text>
        <text x="330" y="212" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">→ la frecuencia y la energía aumentan</text>

        <text x="20" y="248" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Izquierda: ondas largas, poca energía. Atraviesan obstáculos y se usan para comunicar.</text>
        <text x="20" y="270" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Derecha: ondas cortísimas, mucha energía. Penetran en la materia y pueden dañar las células.</text>
      </svg>