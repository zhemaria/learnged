<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Árbol genealógico de tres generaciones. En la primera generación, un varón no afectado se une con una mujer no afectada. Tienen dos hijos: un varón afectado y una mujer no afectada. Esa mujer se une con un varón no afectado y tienen un hijo varón afectado. Como el rasgo reaparece en la tercera generación a través de personas no afectadas, la mujer de la segunda generación tiene que ser portadora.">
        <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f">
          <text x="20" y="66">I</text>
          <text x="20" y="176">II</text>
          <text x="20" y="266">III</text>
        </g>

        <line x1="222" y1="60" x2="298" y2="60" stroke="#1e400f" stroke-width="2.5"/>
        <line x1="260" y1="60" x2="260" y2="110" stroke="#1e400f" stroke-width="2.5"/>
        <line x1="170" y1="110" x2="350" y2="110" stroke="#1e400f" stroke-width="2.5"/>
        <line x1="170" y1="110" x2="170" y2="140" stroke="#1e400f" stroke-width="2.5"/>
        <line x1="350" y1="110" x2="350" y2="140" stroke="#1e400f" stroke-width="2.5"/>

        <rect x="178" y="38" width="44" height="44" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>
        <circle cx="320" cy="60" r="22" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>

        <rect x="148" y="140" width="44" height="44" fill="#1e400f" stroke="#1e400f" stroke-width="3"/>
        <circle cx="350" cy="162" r="22" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>

        <line x1="372" y1="162" x2="448" y2="162" stroke="#1e400f" stroke-width="2.5"/>
        <rect x="448" y="140" width="44" height="44" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>
        <line x1="410" y1="162" x2="410" y2="212" stroke="#1e400f" stroke-width="2.5"/>
        <line x1="410" y1="212" x2="410" y2="230" stroke="#1e400f" stroke-width="2.5"/>
        <rect x="388" y="230" width="44" height="44" fill="#1e400f" stroke="#1e400f" stroke-width="3"/>

        <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">
          <text x="200" y="98">I-1</text>
          <text x="320" y="98">I-2</text>
          <text x="170" y="200">II-1</text>
          <text x="350" y="200">II-2</text>
          <text x="470" y="200">II-3</text>
          <text x="410" y="290">III-1</text>
        </g>

        <g font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f">
          <rect x="60" y="304" width="18" height="18" fill="#eef7ef" stroke="#1e400f" stroke-width="2.5"/>
          <text x="86" y="318">varón</text>
          <circle cx="178" cy="313" r="9" fill="#eef7ef" stroke="#1e400f" stroke-width="2.5"/>
          <text x="194" y="318">mujer</text>
          <rect x="290" y="304" width="18" height="18" fill="#1e400f"/>
          <text x="316" y="318">manifiesta el rasgo</text>
          <rect x="470" y="304" width="18" height="18" fill="#eef7ef" stroke="#1e400f" stroke-width="2.5"/>
          <text x="496" y="318">no lo manifiesta</text>
        </g>
      </svg>