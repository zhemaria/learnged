<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema de la relación entre la fotosíntesis y la respiración celular. La fotosíntesis ocurre en el cloroplasto: seis moléculas de dióxido de carbono más seis de agua más luz producen una molécula de glucosa y seis de oxígeno. La respiración celular ocurre en la mitocondria: una molécula de glucosa más seis de oxígeno producen seis de dióxido de carbono, seis de agua y energía. Los productos de cada proceso son los reactivos del otro: la glucosa y el oxígeno pasan de la fotosíntesis a la respiración, y el dióxido de carbono y el agua vuelven de la respiración a la fotosíntesis.">
        <rect x="130" y="42" width="440" height="76" rx="10" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <text x="350" y="66" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f3d16" text-anchor="middle">FOTOSÍNTESIS · en el cloroplasto</text>
        <text x="350" y="99" font-family="Segoe UI, sans-serif" font-size="17" fill="#0f3d16" text-anchor="middle">6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ + 6 O₂</text>

        <rect x="130" y="172" width="440" height="76" rx="10" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <text x="350" y="196" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f3d16" text-anchor="middle">RESPIRACIÓN CELULAR · en la mitocondria</text>
        <text x="350" y="229" font-family="Segoe UI, sans-serif" font-size="17" fill="#0f3d16" text-anchor="middle">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energía</text>

        <path d="M 570 100 L 640 100 L 640 190 L 570 190" fill="none" stroke="#1b5e20" stroke-width="3"/>
        <polygon points="570,190 584,183 584,197" fill="#1b5e20"/>
        <rect x="588" y="118" width="104" height="54" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="2"/>
        <text x="640" y="139" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">glucosa</text>
        <text x="640" y="157" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">y O₂</text>

        <path d="M 130 190 L 60 190 L 60 100 L 130 100" fill="none" stroke="#1b5e20" stroke-width="3"/>
        <polygon points="130,100 116,93 116,107" fill="#1b5e20"/>
        <rect x="8" y="118" width="104" height="54" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="2"/>
        <text x="60" y="139" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">CO₂</text>
        <text x="60" y="157" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">y H₂O</text>

        <text x="350" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f3d16" text-anchor="middle">Lo que produce una es lo que consume la otra</text>
        <text x="350" y="274" font-family="Segoe UI, sans-serif" font-size="12" fill="#0f3d16" text-anchor="middle">La fotosíntesis almacena energía en la glucosa; la respiración la libera</text>
      </svg>