<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Red trófica sencilla. Desde la hierba, que es el productor, parten flechas hacia el saltamontes y hacia el conejo, que son consumidores primarios. Del saltamontes parte una flecha hacia la rana y del conejo hacia el zorro, ambos consumidores secundarios. De la rana y del zorro parten flechas hacia el halcón, consumidor terciario. Todas las flechas indican la dirección en que fluye la energía.">
        <rect x="270" y="234" width="160" height="44" rx="8" fill="#bfd9a9" stroke="#1e400f" stroke-width="3"/>
        <text x="350" y="254" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Hierba</text>
        <text x="350" y="271" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">productor</text>

        <rect x="120" y="156" width="160" height="44" rx="8" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
        <text x="200" y="176" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Saltamontes</text>
        <text x="200" y="193" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">consumidor primario</text>

        <rect x="420" y="156" width="160" height="44" rx="8" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
        <text x="500" y="176" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Conejo</text>
        <text x="500" y="193" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">consumidor primario</text>

        <rect x="120" y="80" width="160" height="44" rx="8" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>
        <text x="200" y="100" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Rana</text>
        <text x="200" y="117" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">consumidor secundario</text>

        <rect x="420" y="80" width="160" height="44" rx="8" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>
        <text x="500" y="100" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Zorro</text>
        <text x="500" y="117" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">consumidor secundario</text>

        <rect x="270" y="14" width="160" height="44" rx="8" fill="#eef7ef" stroke="#1e400f" stroke-width="3"/>
        <text x="350" y="34" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Halcón</text>
        <text x="350" y="51" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">consumidor terciario</text>

        <g stroke="#1e400f" stroke-width="2.5" fill="none">
          <line x1="300" y1="240" x2="220" y2="210"/>
          <line x1="400" y1="240" x2="480" y2="210"/>
          <line x1="200" y1="152" x2="200" y2="134"/>
          <line x1="500" y1="152" x2="500" y2="134"/>
          <line x1="230" y1="80" x2="300" y2="62"/>
          <line x1="470" y1="80" x2="400" y2="62"/>
        </g>
        <g fill="#1e400f">
          <polygon points="212,207 226,203 219,215"/>
          <polygon points="488,207 474,203 481,215"/>
          <polygon points="200,126 194,138 206,138"/>
          <polygon points="500,126 494,138 506,138"/>
          <polygon points="308,60 294,62 302,72"/>
          <polygon points="392,60 406,62 398,72"/>
