<svg
            width="700"
            height="330"
            viewBox="0 0 700 330"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Diagrama del ciclo del agua. El Sol calienta la superficie del océano y provoca la evaporación: el agua líquida pasa a vapor y asciende. Las plantas aportan además vapor por transpiración. A cierta altura, el vapor se enfría y se produce la condensación, que forma las nubes. Cuando las gotas crecen lo suficiente, cae la precipitación en forma de lluvia o nieve. Parte del agua caída se desliza por la superficie como escorrentía y regresa al océano, y otra parte se infiltra en el terreno y pasa a formar agua subterránea. El ciclo no tiene principio ni final.">
            <circle cx="80" cy="52" r="26" fill="#f9e79f" stroke="#3c1478" stroke-width="2" />
            <text x="80" y="58" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Sol</text>

            <path d="M 20 250 Q 200 236 380 250 L 380 300 L 20 300 Z" fill="#c0a9ec" stroke="#3c1478" stroke-width="2" />
            <text x="150" y="282" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478">Océano</text>
            <path d="M 380 250 Q 500 214 620 244 L 680 300 L 380 300 Z" fill="#e6dcf9" stroke="#3c1478" stroke-width="2" />
            <text x="440" y="294" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478">Tierra</text>

            <path d="M 140 246 Q 128 180 150 130" fill="none" stroke="#5b21b6" stroke-width="3" />
            <polygon points="143,136 150,118 157,136" fill="#5b21b6" />
            <text x="98" y="196" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Evaporación</text>

            <path d="M 470 232 Q 462 186 476 150" fill="none" stroke="#5b21b6" stroke-width="3" stroke-dasharray="7 5" />
            <polygon points="469,156 476,138 483,156" fill="#5b21b6" />
            <text x="486" y="196" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Transpiración</text>

            <ellipse cx="290" cy="106" rx="76" ry="30" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <text x="290" y="112" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Condensación</text>
            <text x="290" y="66" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">El vapor se enfría y forma nubes</text>

            <line x1="256" y1="140" x2="248" y2="188" stroke="#5b21b6" stroke-width="3" />
            <polygon points="241,180 246,200 255,184" fill="#5b21b6" />
            <line x1="300" y1="140" x2="292" y2="188" stroke="#5b21b6" stroke-width="3" />
            <polygon points="285,180 290,200 299,184" fill="#5b21b6" />
            <text x="330" y="176" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Precipitación</text>

            <path d="M 500 244 Q 440 258 392 254" fill="none" stroke="#5b21b6" stroke-width="3" />
            <polygon points="398,247 380,254 398,261" fill="#5b21b6" />
            <text x="392" y="272" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Escorrentía</text>

            <line x1="600" y1="250" x2="600" y2="284" stroke="#5b21b6" stroke-width="3" />
            <polygon points="593,280 600,296 607,280" fill="#5b21b6" />
            <text x="590" y="270" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="end">Infiltración</text>
            <text x="590" y="286" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="end">(agua subterránea)</text>

            <text x="350" y="322" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">
              El ciclo no tiene principio ni final: es siempre la misma agua
            </text>
          </svg>