<svg
            width="700"
            height="270"
            viewBox="0 0 700 270"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Los tres tipos de límite entre placas tectónicas. En el límite divergente, las dos placas se separan y por la abertura asciende material del manto que forma corteza nueva; es lo que ocurre en las dorsales oceánicas. En el límite convergente, las dos placas chocan: la más densa se hunde bajo la otra en un proceso llamado subducción, y allí se forman volcanes, fosas oceánicas y grandes cordilleras. En el límite transformante, las placas se deslizan lateralmente una junto a otra sin crear ni destruir corteza, y la fricción acumulada se libera en forma de terremotos.">
            <rect x="12" y="14" width="220" height="200" rx="10" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="122" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">Divergente</text>
            <rect x="36" y="96" width="72" height="34" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <rect x="136" y="96" width="72" height="34" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <line x1="30" y1="78" x2="66" y2="78" stroke="#3c1478" stroke-width="3" />
            <polygon points="36,72 22,78 36,84" fill="#3c1478" />
            <line x1="178" y1="78" x2="214" y2="78" stroke="#3c1478" stroke-width="3" />
            <polygon points="208,72 222,78 208,84" fill="#3c1478" />
            <path d="M 122 152 L 122 116" stroke="#7c3aed" stroke-width="4" />
            <polygon points="114,120 122,104 130,120" fill="#7c3aed" />
            <text x="122" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Se separan: sube material</text>
            <text x="122" y="198" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Se crea corteza nueva</text>

            <rect x="244" y="14" width="220" height="200" rx="10" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="354" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">Convergente</text>
            <rect x="268" y="96" width="80" height="32" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <polygon points="356,96 436,96 436,128 380,128" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <line x1="290" y1="78" x2="330" y2="78" stroke="#3c1478" stroke-width="3" />
            <polygon points="324,72 338,78 324,84" fill="#3c1478" />
            <line x1="418" y1="78" x2="378" y2="78" stroke="#3c1478" stroke-width="3" />
            <polygon points="384,72 370,78 384,84" fill="#3c1478" />
            <path d="M 354 130 L 347 146" stroke="#7c3aed" stroke-width="4" />
            <polygon points="339,143 342,160 353,148" fill="#7c3aed" />
            <text x="354" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Chocan: la más densa se hunde</text>
            <text x="354" y="198" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Volcanes, fosas y cordilleras</text>

            <rect x="476" y="14" width="212" height="200" rx="10" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="582" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">Transformante</text>
            <rect x="500" y="90" width="164" height="26" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <rect x="500" y="118" width="164" height="26" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <line x1="520" y1="78" x2="580" y2="78" stroke="#3c1478" stroke-width="3" />
            <polygon points="574,72 588,78 574,84" fill="#3c1478" />
            <line x1="644" y1="158" x2="584" y2="158" stroke="#3c1478" stroke-width="3" />
            <polygon points="590,152 576,158 590,164" fill="#3c1478" />
            <text x="582" y="182" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Se deslizan de lado</text>
            <text x="582" y="200" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Terremotos, sin crear ni destruir</text>

            <text x="350" y="248" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">
              En el límite convergente decide la densidad: se hunde la placa más densa
            </text>
          </svg>