<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclo del carbono en cuatro etapas. Desde la atmósfera, el dióxido de carbono pasa a la planta mediante la fotosíntesis. De la planta pasa al herbívoro mediante la alimentación. Del herbívoro pasa a los descomponedores tras la muerte. Y de los descomponedores regresa a la atmósfera mediante la descomposición y la respiración. El ciclo se cierra sobre sí mismo.">
        <g stroke="#1b5e20" stroke-width="3" fill="none">
          <line x1="420" y1="52" x2="516" y2="118"/>
          <line x1="558" y1="162" x2="428" y2="232"/>
          <line x1="278" y1="242" x2="152" y2="164"/>
          <line x1="128" y1="108" x2="276" y2="52"/>
        </g>
        <g fill="#1b5e20">
          <polygon points="520,121 505,116 512,129"/>
          <polygon points="424,234 439,229 432,242"/>
          <polygon points="148,161 163,164 154,175"/>
          <polygon points="280,51 265,48 271,61"/>
        </g>

        <rect x="280" y="20" width="140" height="52" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <text x="350" y="42" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Atmósfera</text>
        <text x="350" y="61" font-family="Segoe UI, sans-serif" font-size="13" fill="#0f3d16" text-anchor="middle">CO₂</text>

        <rect x="520" y="110" width="150" height="52" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <text x="595" y="132" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Planta</text>
        <text x="595" y="151" font-family="Segoe UI, sans-serif" font-size="13" fill="#0f3d16" text-anchor="middle">glucosa</text>

        <rect x="280" y="220" width="140" height="52" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <text x="350" y="242" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Herbívoro</text>
        <text x="350" y="261" font-family="Segoe UI, sans-serif" font-size="13" fill="#0f3d16" text-anchor="middle">tejidos</text>

        <rect x="30" y="110" width="160" height="52" rx="8" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <text x="110" y="132" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Descomponedores</text>
        <text x="110" y="151" font-family="Segoe UI, sans-serif" font-size="13" fill="#0f3d16" text-anchor="middle">hongos, bacterias</text>

        <rect x="428" y="74" width="96" height="26" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="2"/>
        <text x="476" y="92" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f3d16" text-anchor="middle">fotosíntesis</text>

        <rect x="444" y="182" width="96" height="26" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="2"/>
        <text x="492" y="200" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f3d16" text-anchor="middle">alimentación</text>

        <rect x="176" y="186" width="80" height="26" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="2"/>
        <text x="216" y="204" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f3d16" text-anchor="middle">muerte</text>

        <rect x="146" y="64" width="112" height="26" rx="8" fill="#eef7ef" stroke="#1b5e20" stroke-width="2"/>
        <text x="202" y="82" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f3d16" text-anchor="middle">descomposición</text>
      </svg>