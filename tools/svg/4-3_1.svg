<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cladograma de cinco especies. En la parte superior, de izquierda a derecha, están las puntas: lamprea, tiburón, rana, lagarto y ratón. Desde abajo, la raíz lleva la marca de la columna vertebral y sube hasta un primer nodo del que sale, por un lado, la lamprea y, por otro, el resto del grupo. En la rama que lleva al resto está marcada la aparición de las mandíbulas. Esa rama llega a un segundo nodo del que sale el tiburón por un lado y, por otro, una rama marcada con la aparición de las cuatro extremidades. Esa rama llega a un tercer nodo del que sale la rana por un lado y, por otro, una rama marcada con la aparición del huevo amniótico. Esa rama llega a un cuarto nodo, el más reciente de todos, del que salen el lagarto y el ratón. En la rama del ratón está marcada la aparición del pelo. El lagarto y el ratón son, por tanto, las dos especies más emparentadas del diagrama, y la lamprea es la más lejana de todas.">
        <text x="90"  y="40" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Lamprea</text>
        <text x="220" y="40" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Tiburón</text>
        <text x="350" y="40" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Rana</text>
        <text x="480" y="40" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Lagarto</text>
        <text x="610" y="40" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Ratón</text>

        <g stroke="#1e400f" stroke-width="3" fill="none" stroke-linecap="square">
          <line x1="90"  y1="55"  x2="90"  y2="260"/>
          <line x1="220" y1="55"  x2="220" y2="210"/>
          <line x1="350" y1="55"  x2="350" y2="160"/>
          <line x1="480" y1="55"  x2="480" y2="110"/>
          <line x1="610" y1="55"  x2="610" y2="110"/>
          <line x1="480" y1="110" x2="610" y2="110"/>
          <line x1="545" y1="110" x2="545" y2="160"/>
          <line x1="350" y1="160" x2="545" y2="160"/>
          <line x1="448" y1="160" x2="448" y2="210"/>
          <line x1="220" y1="210" x2="448" y2="210"/>
          <line x1="334" y1="210" x2="334" y2="260"/>
          <line x1="90"  y1="260" x2="334" y2="260"/>
          <line x1="212" y1="260" x2="212" y2="300"/>
        </g>

        <g fill="#1e400f">
          <circle cx="545" cy="110" r="6"/>
          <circle cx="448" cy="160" r="6"/>
          <circle cx="334" cy="210" r="6"/>
          <circle cx="212" cy="260" r="6"/>
        </g>

        <g fill="#5C3900">
          <rect x="605" y="80"  width="11" height="11"/>
          <rect x="540" y="132" width="11" height="11"/>
          <rect x="443" y="182" width="11" height="11"/>
          <rect x="329" y="232" width="11" height="11"/>
          <rect x="207" y="277" width="11" height="11"/>
        </g>
        <g font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#5C3900">
          <text x="622" y="90">Pelo</text>
          <text x="557" y="142">Huevo amniótico</text>
          <text x="460" y="192">Cuatro extremidades</text>
          <text x="346" y="242">Mandíbulas</text>
          <text x="224" y="287">Columna vertebral</text>
        </g>

        <text x="212" y="320" font-family="Segoe UI, sans-serif" font-size="12" fill="#1e400f" text-anchor="middle">Antepasado común de todo el grupo</text>

        <rect x="20" y="337" width="11" height="11" fill="#5C3900"/>
        <text x="38" y="347" font-family="Segoe UI, sans-serif" font-size="11" fill="#5C3900">La marca señala el carácter derivado que aparece en esa rama</text>
      </svg>