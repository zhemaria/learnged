<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre una célula animal y una célula vegetal. La célula animal es redondeada, sin pared exterior, y contiene el núcleo con su nucléolo y varias mitocondrias. La célula vegetal es rectangular, rodeada por una pared celular gruesa además de la membrana, y contiene una vacuola central que ocupa gran parte del interior, el núcleo desplazado hacia un lado, varias mitocondrias y varios cloroplastos. La pared celular, la vacuola central y los cloroplastos son exclusivos de la célula vegetal.">
        <text x="170" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Célula animal</text>
        <text x="525" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Célula vegetal</text>

        <ellipse cx="170" cy="130" rx="120" ry="80" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/>
        <circle cx="150" cy="120" r="32" fill="#1b5e20"/>
        <circle cx="150" cy="120" r="11" fill="#c3e2c5"/>
        <g fill="#8d6e63">
          <ellipse cx="100" cy="175" rx="17" ry="9"/>
          <ellipse cx="228" cy="98" rx="17" ry="9"/>
          <ellipse cx="222" cy="165" rx="17" ry="9"/>
        </g>
        <g fill="#37474f">
          <circle cx="110" cy="90" r="4"/><circle cx="128" cy="80" r="4"/>
          <circle cx="196" cy="185" rx="4" r="4"/><circle cx="70" cy="130" r="4"/>
        </g>

        <rect x="395" y="42" width="260" height="180" rx="6" fill="#eef7ef" stroke="#5d4037" stroke-width="8"/>
        <rect x="404" y="51" width="242" height="162" rx="4" fill="none" stroke="#1b5e20" stroke-width="3"/>
        <rect x="425" y="80" width="140" height="115" rx="10" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
        <circle cx="605" cy="95" r="27" fill="#1b5e20"/>
        <circle cx="605" cy="95" r="9" fill="#c3e2c5"/>
        <g fill="#43a047">
          <ellipse cx="600" cy="150" rx="18" ry="10"/>
          <ellipse cx="612" cy="185" rx="18" ry="10"/>
          <ellipse cx="570" cy="205" rx="18" ry="10"/>
        </g>
        <g fill="#8d6e63">
          <ellipse cx="470" cy="63" rx="16" ry="8"/>
          <ellipse cx="560" cy="63" rx="16" ry="8"/>
        </g>

        <g font-family="Segoe UI, sans-serif" font-size="12" fill="#0f3d16">
          <rect x="40" y="243" width="15" height="15" fill="#1b5e20"/><text x="63" y="255">Núcleo</text>
          <rect x="170" y="243" width="15" height="15" fill="#8d6e63"/><text x="193" y="255">Mitocondria</text>
          <rect x="330" y="243" width="15" height="15" fill="#43a047"/><text x="353" y="255">Cloroplasto</text>
          <rect x="490" y="243" width="15" height="15" fill="#37474f"/><text x="513" y="255">Ribosomas</text>
          <rect x="40" y="273" width="15" height="15" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/><text x="63" y="285">Vacuola central</text>
          <rect x="230" y="273" width="15" height="15" fill="#5d4037"/><text x="253" y="285">Pared celular</text>
          <rect x="390" y="273" width="15" height="15" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/><text x="413" y="285">Membrana plasmática</text>
        </g>
      </svg>