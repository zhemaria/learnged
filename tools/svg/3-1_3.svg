<svg width="700" height="240" viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tres casos de ósmosis. En una disolución hipotónica hay poco soluto fuera de la célula, el agua entra y la célula se hincha. En una disolución isotónica la concentración es igual dentro y fuera, entra tanta agua como sale y la célula no cambia. En una disolución hipertónica hay mucho soluto fuera, el agua sale y la célula se arruga.">
        <g font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">
          <text x="130" y="26">Hipotónica</text>
          <text x="350" y="26">Isotónica</text>
          <text x="570" y="26">Hipertónica</text>
        </g>

        <rect x="50" y="38" width="160" height="130" rx="6" fill="#eef7ef" stroke="#1b5e20" stroke-width="2.5"/>
        <circle cx="130" cy="103" r="46" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <g fill="#1565c0">
          <circle cx="68" cy="52" r="4"/><circle cx="192" cy="60" r="4"/><circle cx="75" cy="152" r="4"/>
        </g>
        <g stroke="#1565c0" stroke-width="3" fill="none">
          <line x1="130" y1="44" x2="130" y2="52"/><line x1="130" y1="162" x2="130" y2="154"/>
          <line x1="56" y1="103" x2="64" y2="103"/><line x1="204" y1="103" x2="196" y2="103"/>
        </g>
        <g fill="#1565c0">
          <polygon points="130,56 124,46 136,46"/><polygon points="130,150 124,160 136,160"/>
          <polygon points="68,103 58,97 58,109"/><polygon points="192,103 202,97 202,109"/>
        </g>

        <rect x="270" y="38" width="160" height="130" rx="6" fill="#eef7ef" stroke="#1b5e20" stroke-width="2.5"/>
        <circle cx="350" cy="103" r="36" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <g fill="#1565c0">
          <circle cx="288" cy="52" r="4"/><circle cx="412" cy="60" r="4"/><circle cx="295" cy="152" r="4"/>
          <circle cx="405" cy="145" r="4"/><circle cx="284" cy="105" r="4"/><circle cx="418" cy="100" r="4"/>
        </g>
        <g stroke="#1565c0" stroke-width="3">
          <line x1="350" y1="48" x2="350" y2="62"/><line x1="350" y1="158" x2="350" y2="144"/>
        </g>
        <g fill="#1565c0">
          <polygon points="350,66 344,56 356,56"/><polygon points="350,140 344,150 356,150"/>
          <polygon points="350,44 344,54 356,54"/><polygon points="350,162 344,152 356,152"/>
        </g>

        <rect x="490" y="38" width="160" height="130" rx="6" fill="#eef7ef" stroke="#1b5e20" stroke-width="2.5"/>
        <circle cx="570" cy="103" r="24" fill="#c3e2c5" stroke="#1b5e20" stroke-width="3"/>
        <g fill="#1565c0">
          <circle cx="508" cy="52" r="4"/><circle cx="632" cy="60" r="4"/><circle cx="515" cy="152" r="4"/>
          <circle cx="625" cy="145" r="4"/><circle cx="504" cy="105" r="4"/><circle cx="638" cy="100" r="4"/>
          <circle cx="540" cy="48" r="4"/><circle cx="600" cy="50" r="4"/><circle cx="545" cy="158" r="4"/>
          <circle cx="606" cy="156" r="4"/><circle cx="520" cy="78" r="4"/><circle cx="622" cy="128" r="4"/>
        </g>
        <g stroke="#1565c0" stroke-width="3">
          <line x1="570" y1="74" x2="570" y2="62"/><line x1="570" y1="132" x2="570" y2="144"/>
        </g>
        <g fill="#1565c0">
          <polygon points="570,56 564,66 576,66"/><polygon points="570,150 564,140 576,140"/>
        </g>

        <g font-family="Segoe UI, sans-serif" font-size="12" fill="#0f3d16" text-anchor="middle">
          <text x="130" y="192">Menos soluto fuera</text>
          <text x="130" y="210">El agua entra</text>
          <text x="130" y="228">La célula se hincha</text>
          <text x="350" y="192">Igual dentro y fuera</text>
          <text x="350" y="210">Entra tanta como sale</text>
          <text x="350" y="228">La célula no cambia</text>
          <text x="570" y="192">Más soluto fuera</text>
          <text x="570" y="210">El agua sale</text>
          <text x="570" y="228">La célula se arruga</text>
        </g>
      </svg>