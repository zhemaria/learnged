<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre el enlace iónico y el enlace covalente. En el panel izquierdo, el enlace iónico: un átomo de sodio, que es un metal con un electrón de valencia, transfiere ese electrón a un átomo de cloro, que es un no metal al que le falta uno. El resultado son dos iones de carga opuesta, sodio positivo y cloruro negativo, que se atraen entre sí. En el panel derecho, el enlace covalente: dos átomos no metálicos, en este caso oxígeno e hidrógeno, comparten un par de electrones que pertenece a los dos a la vez, y forman una molécula. La conclusión es que metal más no metal produce enlace iónico, y no metal más no metal produce enlace covalente.">
        <rect x="12" y="14" width="326" height="272" rx="10" fill="#fff8f5" stroke="#8c2600" stroke-width="2"/>
        <text x="175" y="42" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Enlace iónico</text>
        <text x="175" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">El electrón se transfiere</text>

        <circle cx="80" cy="118" r="34" fill="#ffdccf" stroke="#8c2600" stroke-width="3"/>
        <text x="80" y="124" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8c2600" text-anchor="middle">Na</text>
        <circle cx="270" cy="118" r="34" fill="#ffdccf" stroke="#8c2600" stroke-width="3"/>
        <text x="270" y="124" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8c2600" text-anchor="middle">Cl</text>

        <circle cx="122" cy="100" r="9" fill="#8c2600"/>
        <text x="122" y="105" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">−</text>
        <line x1="136" y1="100" x2="216" y2="100" stroke="#8c2600" stroke-width="2"/>
        <polygon points="216,94 230,100 216,106" fill="#8c2600"/>

        <text x="80" y="176" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">Metal · 1 e⁻ de valencia</text>
        <text x="270" y="176" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">No metal · le falta 1 e⁻</text>

        <rect x="42" y="196" width="76" height="34" rx="8" fill="#ffc8b3" stroke="#8c2600" stroke-width="2"/>
        <text x="80" y="219" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Na⁺</text>
        <rect x="232" y="196" width="76" height="34" rx="8" fill="#ffc8b3" stroke="#8c2600" stroke-width="2"/>
        <text x="270" y="219" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Cl⁻</text>
        <text x="175" y="219" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8c2600" text-anchor="middle">↔</text>
        <text x="175" y="258" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Cargas opuestas que se atraen:</text>
        <text x="175" y="276" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">sal común (NaCl)</text>

        <rect x="356" y="14" width="332" height="272" rx="10" fill="#fff8f5" stroke="#8c2600" stroke-width="2"/>
        <text x="522" y="42" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Enlace covalente</text>
        <text x="522" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Los electrones se comparten</text>

        <circle cx="470" cy="126" r="42" fill="#ffdccf" stroke="#8c2600" stroke-width="3"/>
        <text x="464" y="132" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8c2600" text-anchor="middle">O</text>
        <circle cx="562" cy="126" r="30" fill="#ffdccf" stroke="#8c2600" stroke-width="3"/>
        <text x="570" y="132" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#8c2600" text-anchor="middle">H</text>
        <circle cx="516" cy="116" r="8" fill="#8c2600"/>
        <circle cx="516" cy="138" r="8" fill="#8c2600"/>

        <text x="522" y="196" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Los dos electrones del centro</text>
        <text x="522" y="214" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">pertenecen a los dos átomos a la vez</text>
        <rect x="424" y="230" width="196" height="34" rx="8" fill="#ffc8b3" stroke="#8c2600" stroke-width="2"/>
        <text x="522" y="253" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">Molécula de agua (H₂O)</text>
        <text x="522" y="284" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Dos no metales unidos</text>
      </svg>