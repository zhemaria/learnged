<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema de las tres comprobaciones que deben hacerse antes de declarar que dos estudios se contradicen. La primera es el método: si midieron de manera distinta, los resultados pueden no ser comparables. La segunda es la muestra: si estudiaron poblaciones, lugares o periodos distintos, ambos resultados pueden ser correctos a la vez. La tercera es el alcance: si uno afirma algo general y el otro algo particular, no están hablando de lo mismo. Solo cuando método, muestra y alcance coinciden y los resultados siguen siendo incompatibles, existe una contradicción real que requiere más investigación.">
        <rect x="16" y="20" width="212" height="112" rx="10" fill="#eef4fd" stroke="#08306b" stroke-width="2"/>
        <text x="122" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#08306b" text-anchor="middle">1 · Método</text>
        <text x="122" y="72" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">¿Midieron de la misma</text>
        <text x="122" y="90" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">manera?</text>
        <text x="122" y="116" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#08306b" text-anchor="middle">Si no, no son comparables</text>

        <rect x="244" y="20" width="212" height="112" rx="10" fill="#eef4fd" stroke="#08306b" stroke-width="2"/>
        <text x="350" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#08306b" text-anchor="middle">2 · Muestra</text>
        <text x="350" y="72" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">¿Estudiaron lo mismo,</text>
        <text x="350" y="90" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">dónde y cuándo?</text>
        <text x="350" y="116" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#08306b" text-anchor="middle">Si no, pueden ser ambos ciertos</text>

        <rect x="472" y="20" width="212" height="112" rx="10" fill="#eef4fd" stroke="#08306b" stroke-width="2"/>
        <text x="578" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#08306b" text-anchor="middle">3 · Alcance</text>
        <text x="578" y="72" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">¿Afirman lo mismo, con</text>
        <text x="578" y="90" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">la misma amplitud?</text>
        <text x="578" y="116" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#08306b" text-anchor="middle">Si no, hablan de cosas distintas</text>

        <line x1="122" y1="138" x2="300" y2="192" stroke="#0d47a1" stroke-width="3"/>
        <line x1="350" y1="138" x2="350" y2="192" stroke="#0d47a1" stroke-width="3"/>
        <line x1="578" y1="138" x2="400" y2="192" stroke="#0d47a1" stroke-width="3"/>

        <rect x="150" y="198" width="400" height="58" rx="10" fill="#bcd6f5" stroke="#08306b" stroke-width="3"/>
        <text x="350" y="222" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#08306b" text-anchor="middle">Solo si los tres coinciden y los resultados siguen</text>
        <text x="350" y="242" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#08306b" text-anchor="middle">siendo incompatibles hay contradicción real</text>

        <text x="350" y="278" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#08306b" text-anchor="middle">Reconciliar no es decidir quién gana: es localizar dónde difieren</text>
      </svg>