<svg width="700" height="310" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación de dos diagramas de energía. En el diagrama de la izquierda, correspondiente a una reacción exotérmica, los reactivos se sitúan en un nivel de energía alto y los productos en un nivel más bajo; la diferencia se libera al entorno en forma de calor, de modo que el entorno se calienta. En el diagrama de la derecha, correspondiente a una reacción endotérmica, los reactivos se sitúan en un nivel bajo y los productos en un nivel más alto; la diferencia se ha absorbido del entorno, que en consecuencia se enfría. La regla de lectura es que si los productos quedan por debajo de los reactivos la reacción libera calor, y si quedan por encima, la absorbe.">
        <line x1="40" y1="256" x2="330" y2="256" stroke="#222" stroke-width="2"/>
        <line x1="40" y1="256" x2="40" y2="50" stroke="#222" stroke-width="2"/>
        <text x="185" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#8c2600" text-anchor="middle">Exotérmica · libera calor</text>
        <text x="24" y="150" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">E</text>
        <line x1="70" y1="86" x2="150" y2="86" stroke="#bf360c" stroke-width="5"/>
        <text x="110" y="76" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Reactivos</text>
        <line x1="220" y1="196" x2="300" y2="196" stroke="#bf360c" stroke-width="5"/>
        <text x="260" y="216" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Productos</text>
        <path d="M 150 86 Q 185 96 220 196" fill="none" stroke="#bf360c" stroke-width="3"/>
        <line x1="316" y1="86" x2="316" y2="196" stroke="#8c2600" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="165" y="140" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="end">Energía liberada</text>
        <text x="185" y="286" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">El entorno se calienta</text>

        <line x1="380" y1="256" x2="670" y2="256" stroke="#222" stroke-width="2"/>
        <line x1="380" y1="256" x2="380" y2="50" stroke="#222" stroke-width="2"/>
        <text x="525" y="34" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#4527a0" text-anchor="middle">Endotérmica · absorbe calor</text>
        <text x="364" y="150" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">E</text>
        <line x1="410" y1="196" x2="490" y2="196" stroke="#5e35b1" stroke-width="5"/>
        <text x="450" y="216" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4527a0" text-anchor="middle">Reactivos</text>
        <line x1="560" y1="86" x2="640" y2="86" stroke="#5e35b1" stroke-width="5"/>
        <text x="600" y="76" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4527a0" text-anchor="middle">Productos</text>
        <path d="M 490 196 Q 525 186 560 86" fill="none" stroke="#5e35b1" stroke-width="3"/>
        <line x1="656" y1="86" x2="656" y2="196" stroke="#4527a0" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="505" y="140" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="end">Energía absorbida</text>
        <text x="525" y="286" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4527a0" text-anchor="middle">El entorno se enfría</text>
      </svg>