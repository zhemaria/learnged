<svg
            width="700"
            height="320"
            viewBox="0 0 700 320"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Columna estratigráfica con cinco capas de roca sedimentaria y una intrusión. De arriba abajo se representan la capa E, la capa D, la capa C, la capa B y la capa A. Por el principio de superposición, la capa A, situada en el fondo, es la más antigua, y la capa E, situada arriba, es la más reciente. Una intrusión de roca ígnea atraviesa las capas A, B y C pero no la D ni la E, lo que indica que se formó después de depositarse la capa C y antes de depositarse la capa D.">
            <rect x="60" y="50" width="300" height="40" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="76" y="76" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Capa E</text>
            <rect x="60" y="90" width="300" height="40" fill="#e6dcf9" stroke="#3c1478" stroke-width="2" />
            <text x="76" y="116" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Capa D</text>
            <rect x="60" y="130" width="300" height="40" fill="#d3c3f2" stroke="#3c1478" stroke-width="2" />
            <text x="76" y="156" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Capa C</text>
            <rect x="60" y="170" width="300" height="40" fill="#c0a9ec" stroke="#3c1478" stroke-width="2" />
            <text x="76" y="196" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Capa B</text>
            <rect x="60" y="210" width="300" height="40" fill="#ad90e6" stroke="#3c1478" stroke-width="2" />
            <text x="76" y="236" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478">Capa A</text>

            <polygon points="250,250 274,250 268,130 256,130" fill="#5b21b6" stroke="#3c1478" stroke-width="2" />
            <text x="262" y="272" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#3c1478" text-anchor="middle">Intrusión</text>

            <line x1="386" y1="70" x2="386" y2="230" stroke="#3c1478" stroke-width="2" />
            <polygon points="380,224 386,240 392,224" fill="#3c1478" />
            <text x="400" y="66" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Más reciente</text>
            <text x="400" y="244" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478">Más antigua</text>

            <text x="400" y="120" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Principio de superposición:</text>
            <text x="400" y="138" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">lo de abajo se depositó primero.</text>
            <text x="400" y="172" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">La intrusión corta A, B y C,</text>
            <text x="400" y="190" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">pero no D ni E: es posterior a C</text>
            <text x="400" y="208" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">y anterior a D.</text>

            <text x="350" y="300" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">
              Lo que corta a una capa es siempre más joven que la capa que corta
            </text>
          </svg>