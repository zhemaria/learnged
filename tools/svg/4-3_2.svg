<svg width="700" height="250" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos dibujos del mismo cladograma de cuatro especies llamadas A, B, C y D. En la versión 1, las puntas aparecen en el orden A, B, C, D de izquierda a derecha: C y D se unen en el nodo más reciente, B se une a ese grupo en el nodo siguiente y A se une a todo lo demás en el nodo más antiguo. En la versión 2, las puntas aparecen en el orden B, C, D, A: la especie A se ha dibujado en el extremo derecho, junto a D, pero sigue uniéndose a las demás en el nodo más antiguo. Los nodos son los mismos en los dos dibujos, de modo que el parentesco representado es idéntico: A sigue siendo la especie más lejana de todas, aunque en la versión 2 esté dibujada al lado de D.">
        <text x="175" y="20" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Versión 1</text>
        <text x="525" y="20" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f" text-anchor="middle">Versión 2</text>

        <line x1="350" y1="10" x2="350" y2="225" stroke="#757575" stroke-width="1" stroke-dasharray="6 5"/>

        <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">
          <text x="60"  y="55">A</text>
          <text x="140" y="55">B</text>
          <text x="220" y="55">C</text>
          <text x="300" y="55">D</text>
          <text x="400" y="55">B</text>
          <text x="480" y="55">C</text>
          <text x="560" y="55">D</text>
          <text x="640" y="55">A</text>
        </g>

        <g stroke="#1e400f" stroke-width="3" fill="none" stroke-linecap="square">
          <line x1="220" y1="68"  x2="220" y2="105"/>
          <line x1="300" y1="68"  x2="300" y2="105"/>
          <line x1="220" y1="105" x2="300" y2="105"/>
          <line x1="260" y1="105" x2="260" y2="145"/>
          <line x1="140" y1="68"  x2="140" y2="145"/>
          <line x1="140" y1="145" x2="260" y2="145"/>
          <line x1="200" y1="145" x2="200" y2="185"/>
          <line x1="60"  y1="68"  x2="60"  y2="185"/>
          <line x1="60"  y1="185" x2="200" y2="185"/>
          <line x1="130" y1="185" x2="130" y2="210"/>

          <line x1="480" y1="68"  x2="480" y2="105"/>
          <line x1="560" y1="68"  x2="560" y2="105"/>
          <line x1="480" y1="105" x2="560" y2="105"/>
          <line x1="520" y1="105" x2="520" y2="145"/>
          <line x1="400" y1="68"  x2="400" y2="145"/>
          <line x1="400" y1="145" x2="520" y2="145"/>
          <line x1="460" y1="145" x2="460" y2="185"/>
          <line x1="640" y1="68"  x2="640" y2="185"/>
          <line x1="460" y1="185" x2="640" y2="185"/>
          <line x1="550" y1="185" x2="550" y2="210"/>
        </g>

        <g fill="#1e400f">
          <circle cx="260" cy="105" r="5"/>
          <circle cx="200" cy="145" r="5"/>
          <circle cx="130" cy="185" r="5"/>
          <circle cx="520" cy="105" r="5"/>
          <circle cx="460" cy="145" r="5"/>
          <circle cx="550" cy="185" r="5"/>
        </g>

        <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">
          <text x="175" y="237">A se dibuja a la izquierda</text>
          <text x="525" y="237">A se dibuja a la derecha, junto a D</text>
        </g>
      </svg>