<svg
            width="700"
            height="300"
            viewBox="0 0 700 300"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Gráfica de velocidad frente a tiempo con tres tramos. El eje horizontal representa el tiempo y el vertical la velocidad. En el primer tramo la línea sube: la velocidad aumenta, hay aceleración y por tanto una fuerza neta en el sentido del movimiento. En el segundo tramo la línea es horizontal: la velocidad se mantiene constante, no hay aceleración y la fuerza neta es cero, que es la situación descrita por la primera ley. En el tercer tramo la línea baja: la velocidad disminuye, hay desaceleración y la fuerza neta actúa en sentido contrario al movimiento, como ocurre al frenar o por efecto de la fricción.">
            <line x1="70" y1="240" x2="660" y2="240" stroke="#222" stroke-width="2" />
            <line x1="70" y1="240" x2="70" y2="40" stroke="#222" stroke-width="2" />
            <text x="365" y="274" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">Tiempo</text>
            <text x="34" y="140" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">v</text>
            <polyline points="70,220 250,90 440,90 620,215" fill="none" stroke="#1e3a8a" stroke-width="4" />
            <line x1="250" y1="240" x2="250" y2="90" stroke="#c3cdf0" stroke-width="2" stroke-dasharray="5 4" />
            <line x1="440" y1="240" x2="440" y2="90" stroke="#c3cdf0" stroke-width="2" stroke-dasharray="5 4" />
            <text x="160" y="70" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">Sube</text>
            <text x="240" y="200" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="end">Acelera</text>
            <text x="240" y="218" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="end">Fuerza neta a favor</text>
            <text x="345" y="70" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">Horizontal</text>
            <text x="345" y="200" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Velocidad constante</text>
            <text x="345" y="218" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Fuerza neta = 0</text>
            <text x="540" y="70" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">Baja</text>
            <text x="446" y="200" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="start">Frena</text>
            <text x="446" y="218" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="start">Fuerza neta en contra</text>
            <text x="365" y="294" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">
              La inclinación de la línea informa de la fuerza neta, sin necesidad de calcular
            </text>
          </svg>