<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomía de una ecuación química equilibrada. La ecuación mostrada es: dos moléculas de hidrógeno más una de oxígeno producen dos moléculas de agua. A la izquierda de la flecha están los reactivos, que son lo que entra en la reacción; a la derecha están los productos, que es lo que sale. El número grande escrito delante de una fórmula es el coeficiente e indica cuántas moléculas de esa sustancia intervienen; puede modificarse al equilibrar. El número pequeño escrito debajo y a la derecha de un símbolo es el subíndice e indica cuántos átomos de ese elemento hay dentro de la molécula; nunca debe modificarse, porque cambiarlo convertiría la sustancia en otra distinta.">
        <text x="90" y="118" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#bf360c" text-anchor="middle">2</text>
        <text x="140" y="118" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#8c2600" text-anchor="middle">H</text>
        <text x="162" y="128" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#5e35b1" text-anchor="middle">2</text>
        <text x="196" y="118" font-family="Segoe UI, sans-serif" font-size="26" fill="#222" text-anchor="middle">+</text>
        <text x="238" y="118" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#8c2600" text-anchor="middle">O</text>
        <text x="262" y="128" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#5e35b1" text-anchor="middle">2</text>

        <line x1="300" y1="110" x2="380" y2="110" stroke="#222" stroke-width="3"/>
        <polygon points="380,102 396,110 380,118" fill="#222"/>

        <text x="430" y="118" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#bf360c" text-anchor="middle">2</text>
        <text x="480" y="118" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#8c2600" text-anchor="middle">H</text>
        <text x="502" y="128" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#5e35b1" text-anchor="middle">2</text>
        <text x="528" y="118" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#8c2600" text-anchor="middle">O</text>

        <text x="190" y="62" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">REACTIVOS · lo que entra</text>
        <text x="500" y="62" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">PRODUCTOS · lo que sale</text>
        <text x="348" y="146" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">«se transforma en»</text>

        <line x1="90" y1="136" x2="90" y2="186" stroke="#bf360c" stroke-width="2"/>
        <text x="60" y="208" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#bf360c">Coeficiente</text>
        <text x="20" y="228" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Cuántas moléculas intervienen.</text>
        <text x="20" y="246" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">SÍ puede cambiarse al equilibrar.</text>

        <line x1="162" y1="140" x2="290" y2="196" stroke="#5e35b1" stroke-width="2"/>
        <text x="300" y="208" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#4527a0">Subíndice</text>
        <text x="300" y="228" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Cuántos átomos hay dentro de la molécula.</text>
        <text x="300" y="246" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">NUNCA se cambia: sería otra sustancia.</text>
        <text x="20" y="272" font-family="Segoe UI, sans-serif" font-size="12" font-style="italic" fill="#222">Lectura: dos moléculas de hidrógeno y una de oxígeno producen dos de agua.</text>
      </svg>