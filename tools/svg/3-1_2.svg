<svg width="700" height="205" viewBox="0 0 700 205" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre transporte pasivo y transporte activo. En el transporte pasivo las partículas se desplazan desde la zona de alta concentración hacia la de baja concentración, es decir, a favor del gradiente, y no requiere energía. En el transporte activo las partículas se desplazan desde la zona de baja concentración hacia la de alta, en contra del gradiente, y requiere energía en forma de A T P.">
        <text x="175" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Transporte pasivo</text>
        <text x="525" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f3d16" text-anchor="middle">Transporte activo</text>

