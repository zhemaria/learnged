        <text x="175" y="179" font-family="Segoe UI, sans-serif" font-size="12" fill="#0f3d16" text-anchor="middle">A favor del gradiente · no requiere energía</text>

        <rect x="390" y="40" width="120" height="80" rx="6" fill="#eef7ef" stroke="#1b5e20" stroke-width="2.5"/>
