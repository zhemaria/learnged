<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curva de calentamiento del agua. El eje horizontal representa el tiempo de calentamiento y el eje vertical la temperatura en grados Celsius. La curva comienza por debajo de cero grados y sube en línea inclinada mientras el hielo se calienta. Al llegar a cero grados se vuelve horizontal: es la meseta de fusión, durante la cual coexisten hielo y agua líquida y la temperatura no sube aunque se siga aportando calor. Después vuelve a subir en línea inclinada mientras el agua líquida se calienta, hasta llegar a cien grados. Allí aparece la segunda meseta, más larga, que corresponde a la ebullición, durante la cual coexisten agua líquida y vapor. Por último la curva sube de nuevo, ya como vapor.">
        <line x1="70" y1="270" x2="660" y2="270" stroke="#222" stroke-width="2"/>
        <line x1="70" y1="270" x2="70" y2="40" stroke="#222" stroke-width="2"/>
        <text x="365" y="300" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">Tiempo de calentamiento (calor aportado de forma constante)</text>
        <text x="30" y="150" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">°C</text>
        <line x1="64" y1="230" x2="70" y2="230" stroke="#222" stroke-width="2"/>
        <text x="56" y="234" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="end">0</text>
        <line x1="64" y1="120" x2="70" y2="120" stroke="#222" stroke-width="2"/>
        <text x="56" y="124" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="end">100</text>

        <polyline points="80,258 130,230 250,230 330,120 500,120 600,66" fill="none" stroke="#bf360c" stroke-width="4"/>
        <line x1="130" y1="230" x2="250" y2="230" stroke="#8c2600" stroke-width="7"/>
        <line x1="330" y1="120" x2="500" y2="120" stroke="#8c2600" stroke-width="7"/>

        <text x="190" y="218" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Meseta de fusión</text>
        <text x="190" y="252" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">Hielo y agua a la vez</text>
        <text x="415" y="108" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Meseta de ebullición</text>
        <text x="415" y="142" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">Agua y vapor a la vez</text>

        <text x="104" y="290" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">hielo</text>
        <text x="276" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="end">agua líquida</text>
        <text x="612" y="96" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">vapor</text>

        <text x="365" y="322" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">En las mesetas se sigue aportando calor, pero la temperatura no sube</text>
      </svg>