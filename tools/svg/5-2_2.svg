<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curvas de solubilidad. El eje horizontal representa la temperatura del agua en grados Celsius, de cero a cien, y el eje vertical la cantidad de soluto que puede disolverse en cien gramos de agua. Una curva ascendente corresponde a un soluto sólido: cuanto mayor es la temperatura, más cantidad se disuelve. Una curva descendente corresponde a un gas: cuanto mayor es la temperatura, menos gas permanece disuelto. Cualquier punto situado sobre la curva representa una disolución saturada; los puntos por debajo corresponden a disoluciones insaturadas y los puntos por encima, a disoluciones sobresaturadas.">
        <line x1="70" y1="266" x2="660" y2="266" stroke="#222" stroke-width="2"/>
        <line x1="70" y1="266" x2="70" y2="40" stroke="#222" stroke-width="2"/>
        <text x="365" y="296" font-family="Segoe UI, sans-serif" font-size="13" fill="#222" text-anchor="middle">Temperatura del agua (°C)</text>
        <text x="365" y="318" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Eje vertical: gramos de soluto por cada 100 g de agua</text>
        <text x="70" y="284" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">0</text>
        <text x="365" y="284" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">50</text>
        <text x="660" y="284" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">100</text>

        <path d="M 70 240 Q 300 210 660 70" fill="none" stroke="#bf360c" stroke-width="4"/>
        <text x="470" y="58" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#8c2600">Soluto sólido</text>
        <text x="470" y="76" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Más calor, más se disuelve</text>

        <path d="M 70 96 Q 260 200 660 232" fill="none" stroke="#5e35b1" stroke-width="4" stroke-dasharray="9 6"/>
        <text x="150" y="80" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#4527a0">Gas disuelto</text>
        <text x="150" y="98" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Más calor, menos se disuelve</text>

        <circle cx="430" cy="160" r="7" fill="#8c2600"/>
        <text x="444" y="164" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Sobre la curva: disolución saturada</text>
        <text x="180" y="250" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Debajo: insaturada (admite más soluto)</text>
      </svg>