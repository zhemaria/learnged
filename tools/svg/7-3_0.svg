<svg
            width="700"
            height="300"
            viewBox="0 0 700 300"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Las tres líneas de evidencia que sostienen la teoría del Big Bang, presentadas como tres bloques que convergen en una misma conclusión. La primera es el corrimiento al rojo: la luz de las galaxias lejanas llega desplazada hacia longitudes de onda más largas, lo que indica que se alejan de nosotros, y cuanto más lejos están, más rápido se alejan. La segunda es la radiación de fondo de microondas: una radiación débil y uniforme que llega desde todas las direcciones del cielo y que se interpreta como el resto del calor de un universo primitivo mucho más denso y caliente. La tercera es la abundancia de elementos ligeros: la proporción de hidrógeno y helio que se observa en el universo coincide con la que predice el modelo. Las tres líneas son independientes entre sí y apuntan a la misma conclusión: el universo se expande y tuvo un origen común.">
            <rect x="14" y="20" width="212" height="132" rx="10" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="120" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">Corrimiento al rojo</text>
            <text x="120" y="72" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">La luz de las galaxias llega</text>
            <text x="120" y="90" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">con longitud de onda más larga.</text>
            <text x="120" y="116" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Se alejan de nosotros,</text>
            <text x="120" y="134" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">y las más lejanas, más rápido</text>

            <rect x="244" y="20" width="212" height="132" rx="10" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="350" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">Radiación de fondo</text>
            <text x="350" y="72" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Radiación débil y uniforme</text>
            <text x="350" y="90" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">que llega de todas partes.</text>
            <text x="350" y="116" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Resto del calor de un</text>
            <text x="350" y="134" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">universo denso y caliente</text>

            <rect x="474" y="20" width="212" height="132" rx="10" fill="#f3eefc" stroke="#3c1478" stroke-width="2" />
            <text x="580" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">Elementos ligeros</text>
            <text x="580" y="72" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">La proporción de hidrógeno</text>
            <text x="580" y="90" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">y helio que se observa…</text>
            <text x="580" y="116" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">…coincide con la que</text>
            <text x="580" y="134" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">el modelo predice</text>

            <line x1="120" y1="158" x2="300" y2="212" stroke="#5b21b6" stroke-width="3" />
            <line x1="350" y1="158" x2="350" y2="212" stroke="#5b21b6" stroke-width="3" />
            <line x1="580" y1="158" x2="400" y2="212" stroke="#5b21b6" stroke-width="3" />

            <rect x="180" y="218" width="340" height="58" rx="10" fill="#d3c3f2" stroke="#3c1478" stroke-width="3" />
            <text x="350" y="244" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3c1478" text-anchor="middle">El universo se expande</text>
            <text x="350" y="264" font-family="Segoe UI, sans-serif" font-size="13" fill="#3c1478" text-anchor="middle">y tuvo un origen común</text>

            <text x="350" y="294" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">
              Tres observaciones independientes que apuntan a lo mismo
            </text>
          </svg>