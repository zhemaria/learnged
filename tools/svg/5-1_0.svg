<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modelo de Bohr de un átomo de litio. En el centro hay un núcleo que contiene tres protones de carga positiva y cuatro neutrones sin carga. Alrededor del núcleo se dibujan dos niveles de energía en forma de circunferencias: el primer nivel, el más cercano, contiene dos electrones de carga negativa; el segundo nivel contiene un electrón. En total hay tres protones y tres electrones, de modo que el átomo es eléctricamente neutro. El único electrón del nivel exterior es el electrón de valencia.">
        <circle cx="240" cy="145" r="112" fill="none" stroke="#ffc8b3" stroke-width="2"/>
        <circle cx="240" cy="145" r="64" fill="none" stroke="#ffc8b3" stroke-width="2"/>
        <circle cx="240" cy="145" r="34" fill="#ffdccf" stroke="#8c2600" stroke-width="3"/>
        <text x="240" y="140" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#8c2600" text-anchor="middle">3 p⁺</text>
        <text x="240" y="158" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#8c2600" text-anchor="middle">4 n⁰</text>

        <circle cx="176" cy="145" r="12" fill="#8c2600"/>
        <text x="176" y="150" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">−</text>
        <circle cx="304" cy="145" r="12" fill="#8c2600"/>
        <text x="304" y="150" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">−</text>
        <circle cx="240" cy="33" r="12" fill="#8c2600"/>
        <text x="240" y="38" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">−</text>

        <text x="240" y="278" font-family="Segoe UI, sans-serif" font-size="13" fill="#8c2600" text-anchor="middle">Litio · 3 protones, 4 neutrones, 3 electrones</text>

        <text x="404" y="46" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600">Núcleo</text>
        <text x="404" y="66" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Protones (carga +) y neutrones (sin carga).</text>
        <text x="404" y="84" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Concentra casi toda la masa del átomo.</text>

        <text x="404" y="120" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600">Primer nivel de energía</text>
        <text x="404" y="140" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Admite un máximo de 2 electrones.</text>

        <text x="404" y="176" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600">Segundo nivel de energía</text>
        <text x="404" y="196" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Admite un máximo de 8 electrones.</text>
        <text x="404" y="214" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Aquí solo hay 1: es el electrón de valencia,</text>
        <text x="404" y="232" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">y de él dependerá todo el enlace químico.</text>
      </svg>