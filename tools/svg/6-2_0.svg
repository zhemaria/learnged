<svg width="700" height="250" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos situaciones comparadas para decidir si hay trabajo mecánico. En la primera, una persona empuja una caja con una fuerza de cincuenta newtons y la caja se desplaza tres metros en la dirección de la fuerza: sí hay trabajo, y su valor es de ciento cincuenta julios. En la segunda, una persona sostiene una maleta pesada sin moverse del sitio: aplica fuerza hacia arriba, pero no hay desplazamiento, de modo que el trabajo mecánico es cero, aunque la persona se canse.">
        <rect x="14" y="16" width="336" height="218" rx="10" fill="#eef2fc" stroke="#14265e" stroke-width="2"/>
        <text x="182" y="44" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#14265e" text-anchor="middle">Sí hay trabajo</text>
        <rect x="70" y="96" width="62" height="48" rx="6" fill="#dbe2f7" stroke="#14265e" stroke-width="3"/>
        <line x1="140" y1="120" x2="240" y2="120" stroke="#1e3a8a" stroke-width="5"/><polygon points="240,112 258,120 240,128" fill="#1e3a8a"/>
        <text x="196" y="106" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">F = 50 N</text>
        <line x1="70" y1="166" x2="286" y2="166" stroke="#14265e" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="178" y="186" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">d = 3 m</text>
        <text x="182" y="216" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">W = 50 × 3 = 150 J</text>

        <rect x="364" y="16" width="322" height="218" rx="10" fill="#eef2fc" stroke="#14265e" stroke-width="2"/>
        <text x="525" y="44" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#14265e" text-anchor="middle">No hay trabajo</text>
        <rect x="494" y="112" width="62" height="48" rx="6" fill="#dbe2f7" stroke="#14265e" stroke-width="3"/>
        <line x1="525" y1="106" x2="525" y2="72" stroke="#1e3a8a" stroke-width="5"/><polygon points="517,72 525,56 533,72" fill="#1e3a8a"/>
        <text x="600" y="86" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">F hacia arriba</text>
        <text x="525" y="186" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">d = 0 · la maleta no se mueve</text>
        <text x="525" y="216" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">W = 50 × 0 = 0 J</text>
      </svg>