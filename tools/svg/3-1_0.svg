<svg width="700" height="235" viewBox="0 0 700 235" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema de la mitosis en cuatro etapas. En la primera, una célula contiene dos cromosomas, representados como una barra azul y una barra marrón. En la segunda, el ADN se ha duplicado y cada cromosoma aparece por duplicado. En la tercera, las copias se alinean en el centro y se separan hacia lados opuestos. En la cuarta, se han formado dos células hijas, cada una con una barra azul y una barra marrón, es decir, con el mismo número de cromosomas que la célula original y con la misma información.">
        <circle cx="95" cy="100" r="56" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/>
        <rect x="76" y="76" width="11" height="48" rx="5" fill="#1565c0"/>
        <rect x="104" y="82" width="11" height="42" rx="5" fill="#8d6e63"/>

        <circle cx="265" cy="100" r="56" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/>
        <rect x="234" y="76" width="11" height="48" rx="5" fill="#1565c0"/>
        <rect x="248" y="76" width="11" height="48" rx="5" fill="#1565c0"/>
        <rect x="274" y="82" width="11" height="42" rx="5" fill="#8d6e63"/>
        <rect x="288" y="82" width="11" height="42" rx="5" fill="#8d6e63"/>

        <circle cx="435" cy="100" r="56" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/>
        <line x1="435" y1="52" x2="435" y2="148" stroke="#9e1c66" stroke-width="2" stroke-dasharray="5,4"/>
        <rect x="396" y="76" width="11" height="48" rx="5" fill="#1565c0"/>
        <rect x="412" y="82" width="11" height="42" rx="5" fill="#8d6e63"/>
        <rect x="448" y="76" width="11" height="48" rx="5" fill="#1565c0"/>
        <rect x="464" y="82" width="11" height="42" rx="5" fill="#8d6e63"/>
        <g stroke="#0f3d16" stroke-width="2.5">
          <line x1="390" y1="140" x2="372" y2="140"/>
          <line x1="480" y1="140" x2="498" y2="140"/>
        </g>
        <g fill="#0f3d16">
          <polygon points="368,140 379,134 379,146"/>
          <polygon points="502,140 491,134 491,146"/>
        </g>

        <circle cx="570" cy="100" r="33" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/>
        <rect x="558" y="86" width="9" height="30" rx="4" fill="#1565c0"/>
        <rect x="574" y="89" width="9" height="25" rx="4" fill="#8d6e63"/>
        <circle cx="644" cy="100" r="33" fill="#eef7ef" stroke="#1b5e20" stroke-width="3"/>
        <rect x="632" y="86" width="9" height="30" rx="4" fill="#1565c0"/>
        <rect x="648" y="89" width="9" height="25" rx="4" fill="#8d6e63"/>

        <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">
          <text x="95" y="192">1 · Una célula</text>
          <text x="265" y="192">2 · El ADN se duplica</text>
          <text x="435" y="192">3 · Las copias se separan</text>
          <text x="607" y="192">4 · Dos células hijas</text>
        </g>
        <g font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">
          <text x="95" y="212">2 cromosomas</text>
          <text x="265" y="212">cada uno, por duplicado</text>
          <text x="435" y="212">una copia a cada lado</text>
          <text x="607" y="212">2 cromosomas cada una</text>
        </g>
      </svg>