<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema simplificado de la tabla periódica. Las columnas se llaman grupos y las filas, periodos. De izquierda a derecha se representan: el grupo 1, el grupo 2, un bloque ancho de metales de transición, un bloque de elementos donde se encuentran los no metales, el grupo 17 y el grupo 18 en el extremo derecho. Una flecha superior indica que el número atómico aumenta de izquierda a derecha y de arriba abajo. Los metales ocupan la parte izquierda de la tabla y los no metales la parte derecha. La leyenda indica que el grupo 1 son los metales alcalinos con un electrón de valencia, el grupo 2 los alcalinotérreos con dos, el grupo 17 los halógenos con siete y el grupo 18 los gases nobles con la capa completa.">
        <text x="350" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#8c2600" text-anchor="middle">El número atómico aumenta en este sentido</text>
        <line x1="60" y1="38" x2="596" y2="38" stroke="#8c2600" stroke-width="2"/>
        <polygon points="596,32 610,38 596,44" fill="#8c2600"/>

        <rect x="60" y="58" width="42" height="180" fill="#ffdccf" stroke="#8c2600" stroke-width="2"/>
        <rect x="102" y="58" width="42" height="180" fill="#ffdccf" stroke="#8c2600" stroke-width="2"/>
        <rect x="144" y="58" width="210" height="180" fill="#ffefe8" stroke="#8c2600" stroke-width="2"/>
        <rect x="354" y="58" width="168" height="180" fill="#fff8f5" stroke="#8c2600" stroke-width="2"/>
        <rect x="522" y="58" width="42" height="180" fill="#ffdccf" stroke="#8c2600" stroke-width="2"/>
        <rect x="564" y="58" width="42" height="180" fill="#ffc8b3" stroke="#8c2600" stroke-width="2"/>

        <text x="81" y="80" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">1</text>
        <text x="123" y="80" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">2</text>
        <text x="249" y="80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Metales de transición</text>
        <text x="438" y="80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8c2600" text-anchor="middle">Aquí están los no metales</text>
        <text x="543" y="80" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">17</text>
        <text x="585" y="80" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">18</text>

        <text x="207" y="160" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">METALES</text>
        <text x="207" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Tienden a perder electrones</text>
        <text x="438" y="160" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8c2600" text-anchor="middle">NO METALES</text>
        <text x="438" y="180" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Tienden a ganar electrones</text>

        <text x="333" y="258" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Cada columna es un grupo · Cada fila es un periodo</text>

        <text x="20" y="290" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Grupo 1 · Metales alcalinos: 1 electrón de valencia. Muy reactivos.</text>
        <text x="20" y="310" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Grupo 2 · Metales alcalinotérreos: 2 electrones de valencia.</text>
        <text x="20" y="330" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Grupo 17 · Halógenos: 7 electrones de valencia. Les falta uno para completar el nivel.</text>
        <text x="20" y="350" font-family="Segoe UI, sans-serif" font-size="12" fill="#222">Grupo 18 · Gases nobles: el nivel exterior ya está completo. Casi no reaccionan.</text>
      </svg>