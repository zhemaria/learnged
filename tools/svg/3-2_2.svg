<svg width="700" height="270" viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gráfica de la tasa fotosintética frente a la intensidad luminosa. El eje horizontal representa la intensidad luminosa en unidades arbitrarias, de cero a doce. El eje vertical representa la tasa fotosintética, de cero a sesenta. La curva sube con rapidez al principio: en dos unidades de luz la tasa es dieciocho, en cuatro es treinta y cuatro y en seis es cuarenta y cinco. A partir de ocho unidades de luz la curva se aplana en torno a cincuenta y no vuelve a subir aunque la luz siga aumentando. Ese aplanamiento es el punto de saturación.">
        <text x="90" y="20" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f3d16">Tasa fotosintética frente a intensidad luminosa</text>

        <g stroke="#c3e2c5" stroke-width="1">
          <line x1="90" y1="60" x2="620" y2="60"/>
          <line x1="90" y1="113.3" x2="620" y2="113.3"/>
          <line x1="90" y1="166.7" x2="620" y2="166.7"/>
        </g>

        <line x1="90" y1="220" x2="620" y2="220" stroke="#0f3d16" stroke-width="2.5"/>
        <line x1="90" y1="60" x2="90" y2="220" stroke="#0f3d16" stroke-width="2.5"/>

        <line x1="430" y1="56" x2="430" y2="220" stroke="#9e1c66" stroke-width="2" stroke-dasharray="5,4"/>
        <rect x="352" y="28" width="156" height="26" rx="8" fill="#fce1f0" stroke="#9e1c66" stroke-width="2"/>
        <text x="430" y="46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#800d4e" text-anchor="middle">punto de saturación</text>

        <polyline points="90,220 175,172 260,129 345,100 430,87 515,84 600,84" fill="none" stroke="#1b5e20" stroke-width="3.5"/>
        <g fill="#1b5e20">
          <circle cx="90" cy="220" r="4.5"/><circle cx="175" cy="172" r="4.5"/>
          <circle cx="260" cy="129" r="4.5"/><circle cx="345" cy="100" r="4.5"/>
          <circle cx="430" cy="87" r="4.5"/><circle cx="515" cy="84" r="4.5"/>
          <circle cx="600" cy="84" r="4.5"/>
        </g>

        <g font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="end">
          <text x="80" y="64">60</text>
          <text x="80" y="117.3">40</text>
          <text x="80" y="170.7">20</text>
          <text x="80" y="224">0</text>
        </g>
        <text x="30" y="140" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle" transform="rotate(-90 30 140)">Tasa (unid./min)</text>

        <g font-family="Segoe UI, sans-serif" font-size="11" fill="#0f3d16" text-anchor="middle">
          <text x="90" y="240">0</text><text x="175" y="240">2</text><text x="260" y="240">4</text>
          <text x="345" y="240">6</text><text x="430" y="240">8</text><text x="515" y="240">10</text>
          <text x="600" y="240">12</text>
        </g>
        <text x="355" y="262" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f3d16" text-anchor="middle">Intensidad luminosa (unidades arbitrarias)</text>
      </svg>