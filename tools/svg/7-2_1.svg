<svg
            width="700"
            height="330"
            viewBox="0 0 700 330"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Esquema del efecto invernadero. Desde arriba llega radiación solar de longitud de onda corta, que atraviesa la capa de gases de efecto invernadero y alcanza la superficie de la Tierra. La superficie se calienta y emite hacia arriba radiación infrarroja de longitud de onda larga. Una parte de esa radiación infrarroja logra escapar al espacio, pero otra parte es absorbida por los gases de efecto invernadero y reemitida hacia la superficie, de modo que el calor permanece en el sistema. La conclusión es que el efecto invernadero es un fenómeno natural e imprescindible: sin él la temperatura media del planeta estaría muy por debajo del punto de congelación. Lo que altera el clima no es su existencia, sino su intensificación por el aumento de gases.">
            <rect x="20" y="238" width="660" height="46" rx="6" fill="#c0a9ec" stroke="#3c1478" stroke-width="2" />
            <text x="350" y="266" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Superficie de la Tierra</text>

            <rect x="20" y="96" width="660" height="42" rx="6" fill="#e6dcf9" stroke="#3c1478" stroke-width="2" stroke-dasharray="9 5" />
            <text x="290" y="114" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Capa de gases de efecto invernadero</text>
            <text x="290" y="130" font-family="Segoe UI, sans-serif" font-size="12" fill="#3c1478" text-anchor="middle">(CO₂, metano, vapor de agua)</text>

            <text x="90" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Radiación solar</text>
            <text x="90" y="48" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">(onda corta)</text>
            <line x1="90" y1="58" x2="90" y2="226" stroke="#5b21b6" stroke-width="4" />
            <polygon points="82,220 90,238 98,220" fill="#5b21b6" />
            <text x="102" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#222">Atraviesa la capa</text>

            <text x="628" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Parte escapa</text>
            <line x1="628" y1="230" x2="628" y2="52" stroke="#5b21b6" stroke-width="3" stroke-dasharray="8 5" />
            <polygon points="620,58 628,40 636,58" fill="#5b21b6" />

            <text x="500" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3c1478" text-anchor="middle">Radiación infrarroja</text>
            <text x="500" y="48" font-family="Segoe UI, sans-serif" font-size="11" fill="#222" text-anchor="middle">(onda larga, calor)</text>
            <line x1="470" y1="230" x2="470" y2="146" stroke="#5b21b6" stroke-width="4" />
            <polygon points="462,152 470,134 478,152" fill="#5b21b6" />
            <line x1="530" y1="146" x2="530" y2="226" stroke="#5b21b6" stroke-width="4" />
            <polygon points="522,220 530,238 538,220" fill="#5b21b6" />
            <text x="542" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#222">Absorbida y</text>
            <text x="542" y="196" font-family="Segoe UI, sans-serif" font-size="11" fill="#222">reemitida</text>
            <text x="542" y="212" font-family="Segoe UI, sans-serif" font-size="11" fill="#222">hacia abajo</text>

            <text x="350" y="304" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">Sin efecto invernadero la Tierra sería un planeta helado:</text>
            <text x="350" y="322" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3c1478" text-anchor="middle">el problema no es que exista, sino que se intensifique</text>
          </svg>