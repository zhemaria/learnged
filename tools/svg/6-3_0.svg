<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los tres mecanismos de transferencia del calor. Primero, la conducción: el calor viaja por contacto directo a través de un material, como en el mango metálico de una cuchara apoyada en una olla caliente; requiere que haya materia y que las partículas estén en contacto. Segundo, la convección: en un fluido, la porción caliente asciende porque es menos densa y la fría desciende, formando una corriente circular; ocurre en el agua de una olla al hervir y en el aire de una habitación con calefacción. Tercero, la radiación: el calor viaja en forma de ondas electromagnéticas y no necesita ningún material que lo transporte, que es la razón por la que el calor del Sol atraviesa el vacío del espacio.">
        <rect x="12" y="14" width="220" height="216" rx="10" fill="#eef2fc" stroke="#14265e" stroke-width="2"/>
        <text x="122" y="42" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#14265e" text-anchor="middle">Conducción</text>
        <rect x="42" y="120" width="160" height="26" rx="5" fill="#dbe2f7" stroke="#14265e" stroke-width="2"/>
        <circle cx="42" cy="133" r="15" fill="#1e3a8a"/>
        <line x1="66" y1="133" x2="176" y2="133" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="8 6"/>
        <polygon points="176,126 192,133 176,140" fill="#1e3a8a"/>
        <text x="122" y="176" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Por contacto directo,</text>
        <text x="122" y="194" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">a través del material.</text>
        <text x="122" y="216" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Cuchara en una olla</text>

        <rect x="244" y="14" width="220" height="216" rx="10" fill="#eef2fc" stroke="#14265e" stroke-width="2"/>
        <text x="354" y="42" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#14265e" text-anchor="middle">Convección</text>
        <rect x="290" y="70" width="128" height="86" rx="6" fill="#dbe2f7" stroke="#14265e" stroke-width="2"/>
        <path d="M 320 146 Q 306 108 320 82" fill="none" stroke="#1e3a8a" stroke-width="3"/>
        <polygon points="313,86 320,70 327,86" fill="#1e3a8a"/>
        <path d="M 388 82 Q 402 118 388 146" fill="none" stroke="#1e3a8a" stroke-width="3"/>
        <polygon points="381,142 388,158 395,142" fill="#1e3a8a"/>
        <text x="354" y="176" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">Lo caliente sube, lo frío baja:</text>
        <text x="354" y="194" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">se forma una corriente.</text>
        <text x="354" y="216" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">Agua hirviendo, aire de un cuarto</text>

        <rect x="476" y="14" width="212" height="216" rx="10" fill="#eef2fc" stroke="#14265e" stroke-width="2"/>
        <text x="582" y="42" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#14265e" text-anchor="middle">Radiación</text>
        <circle cx="524" cy="118" r="22" fill="#dbe2f7" stroke="#14265e" stroke-width="3"/>
        <path d="M 552 100 q 12 10 24 0 q 12 -10 24 0" fill="none" stroke="#1e3a8a" stroke-width="3"/>
        <path d="M 552 118 q 12 10 24 0 q 12 -10 24 0" fill="none" stroke="#1e3a8a" stroke-width="3"/>
        <path d="M 552 136 q 12 10 24 0 q 12 -10 24 0" fill="none" stroke="#1e3a8a" stroke-width="3"/>
        <text x="582" y="176" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">En forma de ondas.</text>
        <text x="582" y="194" font-family="Segoe UI, sans-serif" font-size="12" fill="#222" text-anchor="middle">No necesita ningún material.</text>
        <text x="582" y="216" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e" text-anchor="middle">El calor del Sol</text>

        <text x="350" y="262" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e" text-anchor="middle">Solo la radiación atraviesa el vacío: las otras dos necesitan materia</text>
      </svg>