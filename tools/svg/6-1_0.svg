<svg
            width="700"
            height="300"
            viewBox="0 0 700 300"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Tres situaciones de fuerza neta sobre una caja. En la primera, dos personas empujan la caja hacia la derecha con treinta newtons cada una: las fuerzas van en el mismo sentido y se suman, de modo que la fuerza neta es de sesenta newtons hacia la derecha y la caja acelera. En la segunda, una fuerza de cincuenta newtons hacia la derecha se opone a otra de cincuenta newtons hacia la izquierda: las fuerzas se restan, la fuerza neta es cero y la caja permanece en reposo o mantiene su velocidad. En la tercera, una fuerza de ochenta newtons hacia la derecha se opone a otra de treinta hacia la izquierda: la fuerza neta es de cincuenta newtons hacia la derecha.">
            <rect x="70" y="46" width="70" height="52" rx="6" fill="#dbe2f7" stroke="#14265e" stroke-width="3" />
            <line x1="20" y1="72" x2="62" y2="72" stroke="#1e3a8a" stroke-width="5" />
            <polygon points="62,64 78,72 62,80" fill="#1e3a8a" />
            <text x="34" y="42" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e">30 N</text>
            <line x1="148" y1="72" x2="190" y2="72" stroke="#1e3a8a" stroke-width="5" />
            <polygon points="190,64 206,72 190,80" fill="#1e3a8a" />
            <text x="160" y="42" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e">30 N</text>
            <text x="300" y="66" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e">Mismo sentido: se suman</text>
            <text x="300" y="88" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">Fuerza neta = 60 N hacia la derecha · la caja acelera</text>

            <rect x="70" y="146" width="70" height="52" rx="6" fill="#dbe2f7" stroke="#14265e" stroke-width="3" />
            <line x1="20" y1="172" x2="62" y2="172" stroke="#1e3a8a" stroke-width="5" />
            <polygon points="62,164 78,172 62,180" fill="#1e3a8a" />
            <text x="34" y="142" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e">50 N</text>
            <line x1="190" y1="172" x2="148" y2="172" stroke="#1e3a8a" stroke-width="5" />
            <polygon points="148,164 132,172 148,180" fill="#1e3a8a" />
            <text x="160" y="142" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e">50 N</text>
            <text x="300" y="166" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e">Sentidos opuestos e iguales: se anulan</text>
            <text x="300" y="188" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">Fuerza neta = 0 N · sigue como estaba</text>

            <rect x="70" y="246" width="70" height="52" rx="6" fill="#dbe2f7" stroke="#14265e" stroke-width="3" />
            <line x1="10" y1="272" x2="62" y2="272" stroke="#1e3a8a" stroke-width="6" />
            <polygon points="62,263 80,272 62,281" fill="#1e3a8a" />
            <text x="26" y="242" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e">80 N</text>
            <line x1="178" y1="272" x2="148" y2="272" stroke="#1e3a8a" stroke-width="4" />
            <polygon points="148,265 134,272 148,279" fill="#1e3a8a" />
            <text x="158" y="242" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#14265e">30 N</text>
            <text x="300" y="266" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14265e">Opuestas y desiguales: se restan</text>
            <text x="300" y="288" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">Fuerza neta = 50 N hacia la derecha</text>
          </svg>