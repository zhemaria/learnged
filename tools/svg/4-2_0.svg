<svg width="700" height="285" viewBox="0 0 700 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre mitosis y meiosis. En la mitosis, una célula con dos cromosomas se divide una sola vez y produce dos células hijas, cada una con dos cromosomas, idénticas a la original. En la meiosis, la misma célula se divide dos veces y produce cuatro células, cada una con un solo cromosoma, es decir, con la mitad. Las células de la mitosis sirven para crecer y reparar; las de la meiosis son los gametos.">
        <text x="175" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Mitosis</text>
        <text x="520" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e400f" text-anchor="middle">Meiosis</text>

        <circle cx="175" cy="72" r="30" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
