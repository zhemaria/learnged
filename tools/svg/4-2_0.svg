        <text x="175" y="250" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">2 células · mismo número de cromosomas</text>
        <text x="175" y="266" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">para crecer y reparar</text>

        <rect x="385" y="232" width="275" height="42" rx="8" fill="#eef7ef" stroke="#1e400f" stroke-width="2"/>
        <text x="522" y="250" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">4 células · la mitad de los cromosomas</text>
        <text x="522" y="266" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">son los gametos</text>
      </svg>