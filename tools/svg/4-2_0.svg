        </g>
        <circle cx="440" cy="140" r="16" fill="#eef7ef" stroke="#1e400f" stroke-width="2"/>
        <circle cx="600" cy="140" r="16" fill="#eef7ef" stroke="#1e400f" stroke-width="2"/>

        <circle cx="390" cy="196" r="24" fill="#bfd9a9" stroke="#1e400f" stroke-width="3"/>
        <rect x="386" y="185" width="8" height="22" rx="4" fill="#1565c0"/>
        <circle cx="470" cy="196" r="24" fill="#bfd9a9" stroke="#1e400f" stroke-width="3"/>
        <rect x="466" y="187" width="8" height="18" rx="4" fill="#8d6e63"/>
