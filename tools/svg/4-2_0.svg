        <rect x="244" y="161" width="8" height="20" rx="4" fill="#8d6e63"/>

        <circle cx="520" cy="72" r="30" fill="#d3e6c2" stroke="#1e400f" stroke-width="3"/>
        <rect x="509" y="59" width="8" height="27" rx="4" fill="#1565c0"/>
        <rect x="524" y="62" width="8" height="22" rx="4" fill="#8d6e63"/>
