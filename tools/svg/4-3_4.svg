<svg width="700" height="265" viewBox="0 0 700 265" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gráfica de crecimiento poblacional en forma de ese. El eje horizontal representa el tiempo y el vertical el número de individuos. Al principio la población crece despacio, después con mucha rapidez, y finalmente el crecimiento se frena y la curva se aplana en un valor máximo. Una línea horizontal discontinua marca ese valor, que es la capacidad de carga del ambiente.">
        <text x="90" y="22" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e400f">Crecimiento de una población con recursos limitados</text>

        <g stroke="#d3e6c2" stroke-width="1">
          <line x1="90" y1="70" x2="620" y2="70"/>
          <line x1="90" y1="120" x2="620" y2="120"/>
          <line x1="90" y1="170" x2="620" y2="170"/>
        </g>

        <line x1="90" y1="220" x2="620" y2="220" stroke="#1e400f" stroke-width="2.5"/>
        <line x1="90" y1="50" x2="90" y2="220" stroke="#1e400f" stroke-width="2.5"/>

        <line x1="90" y1="70" x2="620" y2="70" stroke="#9e1c66" stroke-width="2.5" stroke-dasharray="6,4"/>
        <rect x="430" y="34" width="190" height="26" rx="8" fill="#fce1f0" stroke="#9e1c66" stroke-width="2"/>
        <text x="525" y="52" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#800d4e" text-anchor="middle">capacidad de carga</text>

        <path d="M 90 214 C 170 210, 210 200, 250 165 C 290 128, 320 92, 380 78 C 440 68, 520 71, 620 71"
              fill="none" stroke="#1e400f" stroke-width="3.5"/>

        <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1e400f" text-anchor="middle">
          <text x="160" y="244">crecimiento</text>
          <text x="160" y="258">lento</text>
          <text x="300" y="244">crecimiento</text>
          <text x="300" y="258">rápido</text>
          <text x="500" y="244">el crecimiento</text>
          <text x="500" y="258">se detiene</text>
        </g>

        <text x="34" y="135" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle" transform="rotate(-90 34 135)">Individuos</text>
        <text x="355" y="236" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e400f" text-anchor="middle">Tiempo</text>
      </svg>